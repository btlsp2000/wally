<!DOCTYPE html>
<html lang="en" class="antialiased">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Master TODO Checklist — Bill Tonnesen</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & JetBrains Mono for technical precision -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'media',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
        },
      },
    };
  </script>
  <style>
    /* Custom tactile checkbox styling and smooth transitions */
    .custom-checkbox {
      appearance: none;
      -webkit-appearance: none;
      width: 1.4rem;
      height: 1.4rem;
      border-radius: 0.45rem;
      border: 2px solid #94a3b8;
      background-color: transparent;
      display: inline-grid;
      place-content: center;
      cursor: pointer;
      transition: all 0.16s cubic-bezier(0.22, 1, 0.36, 1);
      flex-shrink: 0;
    }

    @media (prefers-color-scheme: dark) {
      .custom-checkbox {
        border-color: #64748b;
      }
    }

    .custom-checkbox:hover {
      border-color: #0284c7;
      transform: scale(1.05);
    }

    .custom-checkbox:checked {
      background-color: #059669;
      border-color: #059669;
    }

    .custom-checkbox::before {
      content: "";
      width: 0.75rem;
      height: 0.75rem;
      transform: scale(0);
      transition: 120ms transform ease-in-out;
      box-shadow: inset 1em 1em #ffffff;
      transform-origin: center;
      clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
    }

    .custom-checkbox:checked::before {
      transform: scale(1);
    }

    /* Smooth accordion/card elevation */
    .task-row {
      transition: background-color 0.15s ease, opacity 0.15s ease;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen font-sans selection:bg-sky-200 dark:selection:bg-sky-800">

  <!-- Toast Notification Banner (Replaces alert/confirm) -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none max-w-sm w-full px-4 sm:px-0"></div>

  <!-- Confirmation Modal (Replaces confirm) -->
  <div id="confirm-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-950/60 backdrop-blur-xs p-4">
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-2xl max-w-md w-full p-6">
      <h3 id="modal-title" class="text-lg font-bold text-slate-900 dark:text-white mb-2">Confirm Action</h3>
      <p id="modal-message" class="text-sm text-slate-600 dark:text-slate-300 mb-6 leading-relaxed"></p>
      <div class="flex justify-end gap-3">
        <button id="modal-cancel" class="px-4 py-2.5 rounded-xl text-sm font-semibold text-slate-700 dark:text-slate-300 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition cursor-pointer">
          Cancel
        </button>
        <button id="modal-confirm" class="px-4 py-2.5 rounded-xl text-sm font-semibold text-white bg-rose-600 hover:bg-rose-700 transition cursor-pointer shadow-sm">
          Confirm Reset
        </button>
      </div>
    </div>
  </div>

  <!-- Main Container -->
  <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-10">

    <!-- Header & Overall Progress Dashboard -->
    <header class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-sm p-5 sm:p-7 mb-6">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 pb-5 border-b border-slate-100 dark:border-slate-800">
        <div>
          <div class="flex items-center gap-2.5 mb-1">
            <span class="inline-flex items-center px-2.5 py-0.5 rounded-md text-xs font-mono font-semibold bg-sky-100 text-sky-800 dark:bg-sky-950 dark:text-sky-300 border border-sky-200 dark:border-sky-800">
              OFFLINE READY • AUTO-SAVED
            </span>
            <span id="last-saved-indicator" class="text-xs text-slate-500 dark:text-slate-400 font-mono">
              Synced locally
            </span>
          </div>
          <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-slate-900 dark:text-white">
            Master TODO Checklist
          </h1>
          <p class="text-sm text-slate-600 dark:text-slate-400 mt-1">
            Bill Tonnesen • Las Vegas Operations, WallyCAD &amp; Regional Recon
          </p>
        </div>

        <!-- Action Toolbar -->
        <div class="flex flex-wrap items-center gap-2.5">
          <button id="btn-export-copy" class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-semibold bg-slate-900 text-white hover:bg-slate-800 dark:bg-sky-600 dark:hover:bg-sky-500 transition shadow-xs cursor-pointer">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
            </svg>
            Export / Copy Status
          </button>

          <button id="btn-reset-all" class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-semibold text-rose-700 dark:text-rose-400 bg-rose-50 dark:bg-rose-950/50 border border-rose-200 dark:border-rose-900 hover:bg-rose-100 dark:hover:bg-rose-900/60 transition cursor-pointer">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
            Reset All
          </button>
        </div>
      </div>

      <!-- Overall Progress Section -->
      <div class="pt-5">
        <div class="flex items-center justify-between text-sm font-semibold mb-2">
          <span class="text-slate-700 dark:text-slate-300">Overall Completion</span>
          <div class="flex items-center gap-2 font-mono">
            <span id="overall-counter" class="text-slate-900 dark:text-white">0 / 0</span>
            <span id="overall-percent" class="px-2 py-0.5 rounded-md text-xs bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300">0%</span>
          </div>
        </div>
        <div class="w-full h-3.5 bg-slate-200 dark:bg-slate-800 rounded-full overflow-hidden">
          <div id="overall-progress-bar" class="h-full bg-emerald-600 dark:bg-emerald-500 rounded-full transition-all duration-300 ease-out" style="width: 0%"></div>
        </div>
      </div>

      <!-- Scratchpad / Quick Session Notes -->
      <div class="mt-5 pt-4 border-t border-slate-100 dark:border-slate-800">
        <label for="session-notes" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">
          Field Notes &amp; Quick Scratchpad (Auto-Saved)
        </label>
        <textarea
          id="session-notes"
          rows="2"
          placeholder="Jot down transit times, cue specs, phone confirmation numbers, or PDX notes..."
          class="w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950/60 px-3.5 py-2.5 text-sm text-slate-900 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-sky-500 transition"
        ></textarea>
      </div>
    </header>

    <!-- Filter Controls & Priority Sequence Toggle -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-6">
      <!-- Status Filter Tabs -->
      <div class="inline-flex p-1 rounded-xl bg-slate-200/80 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 self-start" role="tablist">
        <button data-filter="all" class="filter-tab px-4 py-2 rounded-lg text-sm font-semibold transition cursor-pointer bg-white dark:bg-slate-800 text-slate-900 dark:text-white shadow-xs">
          All <span id="badge-all" class="ml-1 text-xs font-mono opacity-75">0</span>
        </button>
        <button data-filter="remaining" class="filter-tab px-4 py-2 rounded-lg text-sm font-semibold transition cursor-pointer text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white">
          Remaining <span id="badge-remaining" class="ml-1 text-xs font-mono opacity-75">0</span>
        </button>
        <button data-filter="completed" class="filter-tab px-4 py-2 rounded-lg text-sm font-semibold transition cursor-pointer text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white">
          Completed <span id="badge-completed" class="ml-1 text-xs font-mono opacity-75">0</span>
        </button>
      </div>

      <!-- Today's Priority Sequence Quick-View Toggle -->
      <button id="btn-priority-toggle" class="inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl text-sm font-semibold border transition cursor-pointer bg-amber-50 text-amber-900 border-amber-300 hover:bg-amber-100 dark:bg-amber-950/40 dark:text-amber-200 dark:border-amber-800/70 dark:hover:bg-amber-900/50">
        <svg class="w-4 h-4 text-amber-600 dark:text-amber-400" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
        </svg>
        <span id="priority-toggle-label">Today's Priority Sequence: OFF</span>
      </button>
    </div>

    <!-- Categories Container -->
    <main id="categories-container" class="space-y-6"></main>

    <!-- Footer -->
    <footer class="mt-10 pt-6 border-t border-slate-200 dark:border-slate-800 text-center text-xs text-slate-500 dark:text-slate-400">
      Data is stored locally in your browser (<code class="font-mono">localStorage</code>). Works 100% offline.
    </footer>
  </div>

  <script>
    /**
     * Master TODO Checklist Application
     * Single-file offline-ready task manager with localStorage persistence.
     */
    (function () {
      const STORAGE_KEY = 'bill_tonnesen_master_todo_v1';

      // Default pre-populated categories and tasks
      const DEFAULT_DATA = {
        notes: '',
        categories: [
          {
            id: 'cat-1',
            title: 'Category 1: Immediate Errands & Local Stops (Las Vegas / Henderson)',
            accent: 'sky',
            isPriorityCategory: false,
            tasks: [
              { id: 't-1-1', title: 'Cricket', desc: 'Handle phone bill/account', completed: false, custom: false },
              { id: 't-1-2', title: 'Budget', desc: 'Review current budget', completed: false, custom: false },
              { id: 't-1-3', title: 'Pay', desc: 'Clear immediate bills/payments', completed: false, custom: false },
              { id: 't-1-4', title: 'CareMore', desc: 'Check in on alignment/appointments', completed: false, custom: false },
              { id: 't-1-5', title: 'Walgreens', desc: 'Pharmacy/supplies run', completed: false, custom: false },
              { id: 't-1-6', title: 'Shop', desc: 'Groceries & daily supplies', completed: false, custom: false },
              { id: 't-1-7', title: 'Laundry', desc: 'Wash & fold', completed: false, custom: false },
              { id: 't-1-8', title: 'Room', desc: 'Keep Carson Suites studio squared away', completed: false, custom: false },
              { id: 't-1-9', title: 'Eat', desc: 'Stick to meal routine', completed: false, custom: false },
              { id: 't-1-10', title: 'Sleep', desc: 'Rest & reset', completed: false, custom: false },
              { id: 't-1-11', title: 'Heritage', desc: 'Practice/tournament play & cue testing (Heritage Park Senior Facility, Henderson)', completed: false, custom: false },
              { id: 't-1-12', title: 'Cora Coleman', desc: 'Check table hours/sessions (Cora Coleman Senior Center)', completed: false, custom: false },
              { id: 't-1-13', title: 'Legion', desc: 'Check American Legion post schedules/tables', completed: false, custom: false },
              { id: 't-1-14', title: 'Cue', desc: 'Finalize evaluation/setup on playing cue (17–18 oz McDermott specs / shaft adjustments)', completed: false, custom: false },
              { id: 't-1-15', title: 'Library', desc: 'Study table time, printing, & sketch/coding session (East Las Vegas / West Charleston / Sahara West)', completed: false, custom: false }
            ]
          },
          {
            id: 'cat-2',
            title: 'Category 2: Core Projects & Income',
            accent: 'indigo',
            isPriorityCategory: false,
            tasks: [
              { id: 't-2-1', title: 'Wally (WallyCAD)', desc: 'Standardize & test modules (/s2, /trans-rot, /qc, SquareFont) and update wallycad.com', completed: false, custom: false },
              { id: 't-2-2', title: 'Route Two', desc: 'Lay out & publish next Route 2: The New Family Times broadsheet & 8-page mini-zine', completed: false, custom: false },
              { id: 't-2-3', title: 'CofP (The Calculus of Pool)', desc: 'Complete print manuscript revisions from proof copy for Draft2Digital & sync wallycad.com/cofp', completed: false, custom: false },
              { id: 't-2-4', title: 'Trailer (The Cub / Space Trailer)', desc: "Refine modular folding micro-camper specs for 5'x8' Karavan deck", completed: false, custom: false },
              { id: 't-2-5', title: 'Job', desc: 'Follow up on remote drafting leads & local Southern Nevada contractor/manufacturer pitches', completed: false, custom: false }
            ]
          },
          {
            id: 'cat-3',
            title: 'Category 3: Travel, Reconnaissance & Regional Nodes',
            accent: 'teal',
            isPriorityCategory: false,
            tasks: [
              { id: 't-3-1', title: 'PDX (Portland)', desc: 'Prep December reconnaissance trip logistics & transit connections', completed: false, custom: false },
              { id: 't-3-2', title: 'MTPC Sunday PDX', desc: 'Coordinate Sunday PDX meetup/schedule', completed: false, custom: false },
              { id: 't-3-3', title: 'Sandra', desc: 'Catch up with Sandra in Portland', completed: false, custom: false },
              { id: 't-3-4', title: 'Eugene', desc: 'Map out local stops & pool/client check-ins in Eugene', completed: false, custom: false },
              { id: 't-3-5', title: 'Barstow', desc: 'Check in with Joyce / PO Box & High Desert route notes', completed: false, custom: false },
              { id: 't-3-6', title: 'Wrightwood', desc: 'Log mountain/camp notes & library project references', completed: false, custom: false },
              { id: 't-3-7', title: 'Upland', desc: 'Follow up on George M. Gibson Senior Center tournament notes', completed: false, custom: false },
              { id: 't-3-8', title: 'San Diego', desc: 'Family check-ins (Malcolm & Justin) & SoCal corridor notes', completed: false, custom: false }
            ]
          },
          {
            id: 'cat-4',
            title: 'Category 4: Suggested Priority Sequence (Today / Tomorrow)',
            accent: 'amber',
            isPriorityCategory: true,
            tasks: [
              { id: 't-4-1', title: 'Step 1: Admin & Bills', desc: 'Lock down Budget, Pay, and Cricket first', completed: false, custom: false },
              { id: 't-4-2', title: 'Step 2: Health & Errands', desc: 'Knock out CareMore, Walgreens, Shop, and Laundry in one RTC transit loop', completed: false, custom: false },
              { id: 't-4-3', title: 'Step 3: Table & Desk Time', desc: 'Split afternoon/evening between Library work (Wally / Route Two / CofP) and Play (Heritage or Cora Coleman)', completed: false, custom: false }
            ]
          }
        ]
      };

      // Application State
      let state = loadState();
      let currentFilter = 'all'; // 'all' | 'remaining' | 'completed'
      let priorityOnly = false;

      // DOM References
      const categoriesContainer = document.getElementById('categories-container');
      const overallCounterEl = document.getElementById('overall-counter');
      const overallPercentEl = document.getElementById('overall-percent');
      const overallProgressBar = document.getElementById('overall-progress-bar');
      const badgeAllEl = document.getElementById('badge-all');
      const badgeRemainingEl = document.getElementById('badge-remaining');
      const badgeCompletedEl = document.getElementById('badge-completed');
      const sessionNotesEl = document.getElementById('session-notes');
      const lastSavedEl = document.getElementById('last-saved-indicator');
      const priorityToggleBtn = document.getElementById('btn-priority-toggle');
      const priorityToggleLabel = document.getElementById('priority-toggle-label');

      /**
       * Load state safely from localStorage with fallback to DEFAULT_DATA
       */
      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return structuredClone(DEFAULT_DATA);
          const parsed = JSON.parse(raw);
          if (!parsed || !Array.isArray(parsed.categories)) {
            return structuredClone(DEFAULT_DATA);
          }
          return parsed;
        } catch (err) {
          console.error('Failed to load state from localStorage:', err);
          return structuredClone(DEFAULT_DATA);
        }
      }

      /**
       * Persist state to localStorage and update timestamp badge
       */
      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          const now = new Date();
          const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          lastSavedEl.textContent = `Saved ${timeStr}`;
        } catch (err) {
          console.error('Failed to save state:', err);
          showToast('Storage warning: Unable to save changes locally.', 'error');
        }
      }

      /**
       * Show non-blocking toast notification
       */
      function showToast(message, type = 'success') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        const bgClass =
          type === 'error'
            ? 'bg-rose-600 text-white'
            : 'bg-slate-900 dark:bg-slate-800 text-white border border-slate-700';

        toast.className = `${bgClass} pointer-events-auto px-4 py-3 rounded-xl shadow-lg text-sm font-medium flex items-center justify-between gap-3 transition-all duration-200 transform translate-y-2 opacity-0`;
        toast.innerHTML = `
          <span>${escapeHTML(message)}</span>
          <button class="text-white/70 hover:text-white text-xs font-bold uppercase tracking-wider cursor-pointer">OK</button>
        `;

        container.appendChild(toast);
        requestAnimationFrame(() => {
          toast.classList.remove('translate-y-2', 'opacity-0');
        });

        const dismiss = () => {
          toast.classList.add('opacity-0', 'translate-y-2');
          setTimeout(() => toast.remove(), 200);
        };

        toast.querySelector('button').addEventListener('click', dismiss);
        setTimeout(dismiss, 3200);
      }

      /**
       * Custom confirmation modal replacing window.confirm()
       */
      function showConfirmModal(title, message, onConfirm) {
        const modal = document.getElementById('confirm-modal');
        document.getElementById('modal-title').textContent = title;
        document.getElementById('modal-message').textContent = message;

        modal.classList.remove('hidden');
        modal.classList.add('flex');

        const cancelBtn = document.getElementById('modal-cancel');
        const confirmBtn = document.getElementById('modal-confirm');

        const cleanup = () => {
          modal.classList.add('hidden');
          modal.classList.remove('flex');
          cancelBtn.onclick = null;
          confirmBtn.onclick = null;
        };

        cancelBtn.onclick = cleanup;
        confirmBtn.onclick = () => {
          cleanup();
          onConfirm();
        };
      }

      /**
       * Escape HTML entities to prevent injection in custom task inputs
       */
      function escapeHTML(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      /**
       * Compute overall & filter counts
       */
      function updateGlobalStats() {
        let total = 0;
        let completed = 0;

        state.categories.forEach((cat) => {
          cat.tasks.forEach((t) => {
            total++;
            if (t.completed) completed++;
          });
        });

        const remaining = total - completed;
        const pct = total === 0 ? 0 : Math.round((completed / total) * 100);

        overallCounterEl.textContent = `${completed} / ${total}`;
        overallPercentEl.textContent = `${pct}%`;
        overallProgressBar.style.width = `${pct}%`;

        badgeAllEl.textContent = total;
        badgeRemainingEl.textContent = remaining;
        badgeCompletedEl.textContent = completed;
      }

      /**
       * Render all categories and tasks according to active filters
       */
      function render() {
        updateGlobalStats();
        categoriesContainer.innerHTML = '';

        const visibleCategories = priorityOnly
          ? state.categories.filter((c) => c.isPriorityCategory)
          : state.categories;

        visibleCategories.forEach((category) => {
          const totalInCat = category.tasks.length;
          const completedInCat = category.tasks.filter((t) => t.completed).length;
          const pctCat = totalInCat === 0 ? 0 : Math.round((completedInCat / totalInCat) * 100);

          // Filter tasks inside this category
          const filteredTasks = category.tasks.filter((task) => {
            if (currentFilter === 'remaining') return !task.completed;
            if (currentFilter === 'completed') return task.completed;
            return true;
          });

          // Accent styling map
          const accentBorder = category.isPriorityCategory
            ? 'border-amber-300 dark:border-amber-800/80 ring-1 ring-amber-200/50 dark:ring-amber-900/30'
            : 'border-slate-200 dark:border-slate-800';

          const headerBg = category.isPriorityCategory
            ? 'bg-amber-50/70 dark:bg-amber-950/30'
            : 'bg-slate-50/80 dark:bg-slate-900/80';

          const card = document.createElement('section');
          card.className = `bg-white dark:bg-slate-900 border ${accentBorder} rounded-2xl shadow-xs overflow-hidden`;

          // Category Header
          const headerHtml = `
            <div class="p-4 sm:p-5 ${headerBg} border-b border-slate-200/80 dark:border-slate-800">
              <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-3">
                <div class="flex items-center gap-2">
                  ${
                    category.isPriorityCategory
                      ? '<span class="inline-flex items-center px-2 py-0.5 rounded-md text-xs font-bold bg-amber-200 text-amber-950 dark:bg-amber-900 dark:text-amber-200">PRIORITY</span>'
                      : ''
                  }
                  <h2 class="text-base sm:text-lg font-bold text-slate-900 dark:text-white leading-snug">
                    ${escapeHTML(category.title)}
                  </h2>
                </div>
                <div class="flex items-center gap-2.5 self-start sm:self-auto font-mono text-xs sm:text-sm font-semibold">
                  <span class="text-slate-600 dark:text-slate-300">${completedInCat} / ${totalInCat}</span>
                  <span class="px-2 py-0.5 rounded-md bg-slate-200/80 dark:bg-slate-800 text-slate-800 dark:text-slate-200">${pctCat}%</span>
                </div>
              </div>
              <div class="w-full h-2 bg-slate-200 dark:bg-slate-800 rounded-full overflow-hidden">
                <div class="h-full ${
                  category.isPriorityCategory ? 'bg-amber-500' : 'bg-sky-600 dark:bg-sky-500'
                } rounded-full transition-all duration-300" style="width: ${pctCat}%"></div>
              </div>
            </div>
          `;

          // Task List Container
          const listEl = document.createElement('ul');
          listEl.className = 'divide-y divide-slate-100 dark:divide-slate-800/80';

          if (filteredTasks.length === 0) {
            const emptyLi = document.createElement('li');
            emptyLi.className = 'p-5 text-sm text-slate-500 dark:text-slate-400 italic text-center';
            emptyLi.textContent =
              currentFilter === 'completed'
                ? 'No completed items in this category yet.'
                : 'All items in this category are completed!';
            listEl.appendChild(emptyLi);
          } else {
            filteredTasks.forEach((task) => {
              const li = document.createElement('li');
              li.className = `task-row flex items-start justify-between gap-3 p-3.5 sm:px-5 sm:py-4 hover:bg-slate-50 dark:hover:bg-slate-800/40 ${
                task.completed ? 'bg-slate-50/50 dark:bg-slate-950/30' : ''
              }`;

              const labelId = `chk-${task.id}`;
              li.innerHTML = `
                <label for="${labelId}" class="flex items-start gap-3.5 cursor-pointer flex-1 select-none">
                  <input
                    id="${labelId}"
                    type="checkbox"
                    class="custom-checkbox mt-0.5"
                    ${task.completed ? 'checked' : ''}
                  />
                  <div class="flex-1 min-w-0">
                    <div class="flex flex-wrap items-center gap-2">
                      <span class="text-sm sm:text-base font-bold transition-all ${
                        task.completed
                          ? 'line-through text-slate-400 dark:text-slate-500'
                          : 'text-slate-900 dark:text-slate-100'
                      }">
                        ${escapeHTML(task.title)}
                      </span>
                      ${
                        task.custom
                          ? '<span class="px-1.5 py-0.5 text-[10px] font-mono uppercase tracking-wider rounded bg-sky-100 text-sky-800 dark:bg-sky-950 dark:text-sky-300">Custom</span>'
                          : ''
                      }
                    </div>
                    ${
                      task.desc
                        ? `<p class="text-xs sm:text-sm mt-0.5 leading-relaxed transition-all ${
                            task.completed
                              ? 'line-through text-slate-400 dark:text-slate-600'
                              : 'text-slate-600 dark:text-slate-400'
                          }">${escapeHTML(task.desc)}</p>`
                        : ''
                    }
                  </div>
                </label>
                ${
                  task.custom
                    ? `<button
                        type="button"
                        title="Delete custom task"
                        class="btn-delete-task p-2 rounded-lg text-slate-400 hover:text-rose-600 hover:bg-rose-50 dark:hover:bg-rose-950/50 transition cursor-pointer shrink-0"
                      >
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                        </svg>
                      </button>`
                    : ''
                }
              `;

              // Checkbox toggle listener
              const checkbox = li.querySelector('input[type="checkbox"]');
              checkbox.addEventListener('change', () => {
                task.completed = checkbox.checked;
                saveState();
                render();
              });

              // Delete custom task listener
              if (task.custom) {
                const delBtn = li.querySelector('.btn-delete-task');
                delBtn.addEventListener('click', () => {
                  category.tasks = category.tasks.filter((t) => t.id !== task.id);
                  saveState();
                  render();
                  showToast(`Removed "${task.title}"`);
                });
              }

              listEl.appendChild(li);
            });
          }

          // Add New Task Form Footer inside each category
          const addFooter = document.createElement('div');
          addFooter.className = 'p-3.5 sm:px-5 bg-slate-50/70 dark:bg-slate-950/40 border-t border-slate-100 dark:border-slate-800';
          addFooter.innerHTML = `
            <form class="add-task-form flex flex-col sm:flex-row gap-2">
              <input
                type="text"
                name="taskTitle"
                required
                placeholder="New item title (e.g., RTC Pass)..."
                class="sm:w-1/3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 px-3 py-2 text-sm text-slate-900 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-sky-500"
              />
              <input
                type="text"
                name="taskDesc"
                placeholder="Optional details or location..."
                class="flex-1 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 px-3 py-2 text-sm text-slate-900 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-sky-500"
              />
              <button
                type="submit"
                class="inline-flex items-center justify-center gap-1.5 px-4 py-2 rounded-xl text-sm font-semibold bg-slate-800 text-white hover:bg-slate-700 dark:bg-slate-700 dark:hover:bg-slate-600 transition cursor-pointer shrink-0"
              >
                <span>+ Add</span>
              </button>
            </form>
          `;

          const form = addFooter.querySelector('.add-task-form');
          form.addEventListener('submit', (e) => {
            e.preventDefault();
            const titleInput = form.elements.taskTitle;
            const descInput = form.elements.taskDesc;
            const titleVal = titleInput.value.trim();
            const descVal = descInput.value.trim();

            if (!titleVal) return;

            category.tasks.push({
              id: `custom-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
              title: titleVal,
              desc: descVal,
              completed: false,
              custom: true
            });

            saveState();
            render();
            showToast(`Added "${titleVal}"`);
          });

          card.innerHTML = headerHtml;
          card.appendChild(listEl);
          card.appendChild(addFooter);
          categoriesContainer.appendChild(card);
        });
      }

      /**
       * Wire up filter tabs
       */
      document.querySelectorAll('.filter-tab').forEach((tab) => {
        tab.addEventListener('click', () => {
          currentFilter = tab.dataset.filter;

          document.querySelectorAll('.filter-tab').forEach((t) => {
            const isActive = t.dataset.filter === currentFilter;
            if (isActive) {
              t.classList.add('bg-white', 'dark:bg-slate-800', 'text-slate-900', 'dark:text-white', 'shadow-xs');
              t.classList.remove('text-slate-600', 'dark:text-slate-400');
            } else {
              t.classList.remove('bg-white', 'dark:bg-slate-800', 'text-slate-900', 'dark:text-white', 'shadow-xs');
              t.classList.add('text-slate-600', 'dark:text-slate-400');
            }
          });

          render();
        });
      });

      /**
       * Wire up Today's Priority Sequence toggle
       */
      priorityToggleBtn.addEventListener('click', () => {
        priorityOnly = !priorityOnly;
        if (priorityOnly) {
          priorityToggleLabel.textContent = "Today's Priority Sequence: ON";
          priorityToggleBtn.classList.add('ring-2', 'ring-amber-500', 'bg-amber-100', 'dark:bg-amber-900/60');
        } else {
          priorityToggleLabel.textContent = "Today's Priority Sequence: OFF";
          priorityToggleBtn.classList.remove('ring-2', 'ring-amber-500', 'bg-amber-100', 'dark:bg-amber-900/60');
        }
        render();
      });

      /**
       * Wire up Session Notes auto-save
       */
      sessionNotesEl.value = state.notes || '';
      sessionNotesEl.addEventListener('input', () => {
        state.notes = sessionNotesEl.value;
        saveState();
      });

      /**
       * Export / Copy Checked Status to Clipboard
       */
      document.getElementById('btn-export-copy').addEventListener('click', () => {
        const lines = [];
        const dateStr = new Date().toLocaleDateString([], {
          weekday: 'short',
          year: 'numeric',
          month: 'short',
          day: 'numeric'
        });

        let total = 0;
        let done = 0;
        state.categories.forEach((c) =>
          c.tasks.forEach((t) => {
            total++;
            if (t.completed) done++;
          })
        );

        lines.push(`MASTER TODO CHECKLIST — BILL TONNESEN (${dateStr})`);
        lines.push(`Progress: ${done}/${total} completed (${total ? Math.round((done / total) * 100) : 0}%)`);
        lines.push('==================================================');

        state.categories.forEach((cat) => {
          lines.push('');
          lines.push(cat.title.toUpperCase());
          cat.tasks.forEach((t) => {
            const box = t.completed ? '[x]' : '[ ]';
            lines.push(`${box} ${t.title}${t.desc ? ' — ' + t.desc : ''}`);
          });
        });

        if (state.notes && state.notes.trim()) {
          lines.push('');
          lines.push('FIELD NOTES:');
          lines.push(state.notes.trim());
        }

        const exportText = lines.join('\n');

        // Use reliable textarea + execCommand('copy') fallback for iframe & offline compatibility
        const tempArea = document.createElement('textarea');
        tempArea.value = exportText;
        tempArea.style.position = 'fixed';
        tempArea.style.opacity = '0';
        document.body.appendChild(tempArea);
        tempArea.select();

        try {
          const ok = document.execCommand('copy');
          if (ok) {
            showToast('Checklist status copied to clipboard!');
          } else {
            showToast('Could not copy automatically. Check permissions.', 'error');
          }
        } catch (err) {
          showToast('Copy failed in this browser environment.', 'error');
        } finally {
          document.body.removeChild(tempArea);
        }
      });

      /**
       * Reset All Button with Confirmation Modal
       */
      document.getElementById('btn-reset-all').addEventListener('click', () => {
        showConfirmModal(
          'Reset Entire Checklist?',
          'This will uncheck all items, remove any custom tasks you added, and clear your scratchpad notes back to the default master list.',
          () => {
            state = structuredClone(DEFAULT_DATA);
            sessionNotesEl.value = '';
            saveState();
            render();
            showToast('All tasks reset to default.');
          }
        );
      });

      // Initial render
      render();
    })();
  </script>
</body>
</html>
