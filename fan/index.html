<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WallyCAD | FAN Module</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #121212;
            color: #d4d4d4;
            margin: 0;
            overflow: hidden;
        }
        
        /* Custom scrollbar for text area */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #121212; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #4CAF50; }

        input[type="number"], input[type="range"] {
            background-color: #121212;
            border: 1px solid #333;
            color: #4CAF50;
            padding: 4px 8px;
            font-family: inherit;
            width: 100%;
            border-radius: 2px;
            outline: none;
        }
        input[type="number"]:focus {
            border-color: #4CAF50;
        }
        
        .cad-green { color: #4CAF50; }
        .bg-cad-green { background-color: #4CAF50; }
    </style>
</head>
<body class="flex h-screen w-screen">

    <!-- Sidebar -->
    <aside class="w-[300px] shrink-0 bg-[#1e1e1e] border-r border-[#333] flex flex-col h-full shadow-xl z-10 p-5 overflow-y-auto">
        
        <!-- Header -->
        <div class="mb-6 border-b border-[#333] pb-4">
            <h1 class="text-xl font-bold cad-green uppercase tracking-wide">WallyCAD | FAN</h1>
            <p class="text-xs text-gray-500 mt-1 uppercase">Array-Polar // Matrix Engine</p>
        </div>

        <!-- Input Data -->
        <div class="mb-6 flex-1 flex flex-col min-h-[200px]">
            <label class="block text-xs uppercase text-gray-400 mb-2">Geometric Vector Data</label>
            <textarea id="wallyInput" class="w-full flex-1 bg-[#121212] border border-[#333] rounded p-3 text-xs cad-green resize-none focus:border-[#4CAF50] outline-none leading-relaxed" spellcheck="false">[LINE] -2 -4 2 -4 2 0 -2 0 -2 -4 [WALL] 0.0017 0.0042 -1.9982 0.0042 -3.9983 4.4742 0.0017 4.4743 -3.9983 4.4742 -3.9982 7.4742 0.0017 7.4742 -3.9982 7.4742 0.0017 9.1342 -1.1482 11.9042 -5.1483 10.2443 -3.9982 7.4742 -5.1483 10.2443 -5.3182 16.3042 -1.1482 11.9042 [LINE] -0.0017 0.0042 1.9982 0.0042 3.9983 4.4742 -0.0017 4.4743 3.9983 4.4742 3.9982 7.4742 -0.0017 7.4742 3.9982 7.4742 -0.0017 9.1342 1.1482 11.9042 5.1483 10.2443 3.9982 7.4742 5.1483 10.2443 5.3182 16.3042 1.1482 11.9042</textarea>
        </div>

        <!-- Settings Grid -->
        <div class="space-y-4 mb-6">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-[10px] uppercase text-gray-500 mb-1">Iterations (N)</label>
                    <input type="number" id="paramN" value="4" min="1">
                </div>
                <div>
                    <label class="block text-[10px] uppercase text-gray-500 mb-1">Step Angle (°)</label>
                    <input type="number" id="paramAngle" value="90">
                </div>
                <div>
                    <label class="block text-[10px] uppercase text-gray-500 mb-1">Pivot X (Pc)</label>
                    <input type="number" id="paramPivotX" value="0" step="0.1">
                </div>
                <div>
                    <label class="block text-[10px] uppercase text-gray-500 mb-1">Pivot Y (Pc)</label>
                    <input type="number" id="paramPivotY" value="-4.47" step="0.01">
                </div>
            </div>
            
            <div class="pt-2">
                <div class="flex justify-between items-center mb-1">
                    <label class="text-[10px] uppercase text-gray-500">Viewport Scale</label>
                    <span id="scaleValue" class="text-[10px] cad-green">15x</span>
                </div>
                <input type="range" id="paramScale" min="5" max="50" value="15" class="w-full accent-[#4CAF50]">
            </div>
        </div>

        <!-- Action Button -->
        <button id="btnExecute" class="w-full bg-cad-green hover:bg-[#3d8c40] text-black font-bold uppercase tracking-widest py-3 rounded transition-colors active:scale-[0.98] mb-6">
            Execute / Fan
        </button>

        <!-- Output Data -->
        <div class="flex-1 flex flex-col min-h-[150px]">
            <label class="block text-xs uppercase text-gray-400 mb-2">Generated Output</label>
            <textarea id="wallyOutput" readonly class="w-full flex-1 bg-[#121212] border border-[#333] rounded p-3 text-[10px] text-[#ff8c00] resize-none focus:border-[#4CAF50] outline-none leading-relaxed" placeholder="Fanned geometry will output here..."></textarea>
        </div>
    </aside>

    <!-- Main Canvas -->
    <main id="canvasContainer" class="flex-1 relative cursor-crosshair">
        <canvas id="cadCanvas" class="block w-full h-full"></canvas>
        
        <!-- Live Coordinate Marker -->
        <div class="absolute top-4 right-4 text-xs text-gray-500 bg-[#1e1e1e] px-3 py-1.5 rounded border border-[#333] shadow-lg pointer-events-none">
            Origin (0,0) Offset: <span class="cad-green font-bold">Visible</span>
        </div>
    </main>

    <script>
        const canvas = document.getElementById('cadCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvasContainer');

        // Inputs
        const inputData = document.getElementById('wallyInput');
        const inN = document.getElementById('paramN');
        const inAngle = document.getElementById('paramAngle');
        const inPivotX = document.getElementById('paramPivotX');
        const inPivotY = document.getElementById('paramPivotY');
        const inScale = document.getElementById('paramScale');
        const scaleValDisplay = document.getElementById('scaleValue');
        const outputData = document.getElementById('wallyOutput');
        
        // Universal Parser for WallyCAD strings
        function parseWallyData(inputString) {
            const tokens = inputString.trim().split(/[\s,]+/);
            const parsedGeometry = [];
            let currentSequence = { tag: "[UNTAGGED]", coordinates: [] };
            let tempX = null;

            tokens.forEach(token => {
                if (/^\[.*?\]$/.test(token)) {
                    if (currentSequence.coordinates.length > 0) parsedGeometry.push(currentSequence);
                    currentSequence = { tag: token, coordinates: [] };
                    tempX = null;
                } else {
                    // Try parsing the token as a float. Ignores text like "T:0" inherently (isNaN).
                    const val = parseFloat(token);
                    if (!isNaN(val)) {
                        if (tempX === null) {
                            tempX = val;
                        } else {
                            currentSequence.coordinates.push({ x: tempX, y: val });
                            tempX = null; 
                        }
                    }
                }
            });
            if (currentSequence.coordinates.length > 0) parsedGeometry.push(currentSequence);
            return parsedGeometry;
        }

        // Window resize handler
        function resize() {
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            draw();
        }
        window.addEventListener('resize', resize);

        // Core Drawing Loop
        function draw() {
            // Get Parameters
            const N = parseInt(inN.value) || 1;
            const stepAngleDeg = parseFloat(inAngle.value) || 0;
            const pX = parseFloat(inPivotX.value) || 0;
            const pY = parseFloat(inPivotY.value) || 0;
            const scale = parseInt(inScale.value) || 15;
            
            // Clear screen
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Define drawing origin (CAD 0,0). Move origin to the lower center of the screen
            const originX = canvas.width / 2;
            const originY = canvas.height * 0.75; 

            // Draw Background Grid/Axes
            ctx.lineWidth = 1;
            ctx.strokeStyle = '#222';
            ctx.beginPath();
            // Vertical axis
            ctx.moveTo(originX, 0); ctx.lineTo(originX, canvas.height);
            // Horizontal axis
            ctx.moveTo(0, originY); ctx.lineTo(canvas.width, originY);
            ctx.stroke();

            // Draw Pivot Point Marker
            const pCanvasX = originX + (pX * scale);
            const pCanvasY = originY - (pY * scale); // Y goes up in CAD, down in canvas
            
            ctx.fillStyle = '#ff3333';
            ctx.beginPath();
            ctx.arc(pCanvasX, pCanvasY, 4, 0, Math.PI * 2);
            ctx.fill();

            // Parse Raw Data
            const geometry = parseWallyData(inputData.value);
            if(geometry.length === 0) {
                outputData.value = "";
                return;
            }

            let generatedOutput = "";

            // Array Rotation Logic
            for (let i = 0; i < N; i++) {
                const theta = i * (stepAngleDeg * Math.PI / 180);
                
                // Color configuration: Base element is Green, arrays are Orange
                ctx.strokeStyle = (i === 0) ? '#4CAF50' : '#ff8c00'; // CAD Green : Orange
                ctx.lineWidth = 2;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                geometry.forEach(layer => {
                    if (layer.coordinates.length < 2) return;

                    ctx.beginPath();
                    generatedOutput += layer.tag;
                    
                    layer.coordinates.forEach((node, index) => {
                        // Apply 2D Rotation Matrix around (pX, pY)
                        const rotatedX = (node.x - pX) * Math.cos(theta) - (node.y - pY) * Math.sin(theta) + pX;
                        const rotatedY = (node.x - pX) * Math.sin(theta) + (node.y - pY) * Math.cos(theta) + pY;
                        
                        // Append to output string (Format to 4 decimal places, trimming trailing zeros)
                        generatedOutput += ` ${parseFloat(rotatedX.toFixed(4))} ${parseFloat(rotatedY.toFixed(4))}`;

                        // Map to Screen Coordinates (Invert Y)
                        const screenX = originX + (rotatedX * scale);
                        const screenY = originY - (rotatedY * scale);

                        if (index === 0) {
                            ctx.moveTo(screenX, screenY);
                        } else {
                            ctx.lineTo(screenX, screenY);
                        }
                    });
                    
                    generatedOutput += "\n";
                    ctx.stroke();
                });
                generatedOutput += "\n";
            }
            
            // Set the output box text
            outputData.value = generatedOutput.trim();
        }

        // Event Listeners
        document.getElementById('btnExecute').addEventListener('click', draw);
        inScale.addEventListener('input', (e) => {
            scaleValDisplay.textContent = e.target.value + 'x';
            draw();
        });

        // Init
        setTimeout(resize, 50);
    </script>
</body>
</html>
