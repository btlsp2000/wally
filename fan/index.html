<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WallyCAD | FAN Module</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #121212;
            color: #d4d4d4;
            margin: 0;
            overflow: hidden;
        }
        
        /* Custom scrollbar for text areas */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #121212; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #4CAF50; }

        input[type="number"], input[type="range"] {
            background-color: #121212;
            border: 1px solid #333;
            color: #4CAF50;
            padding: 6px 8px;
            font-family: inherit;
            width: 100%;
            border-radius: 4px;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="number"]:focus {
            border-color: #4CAF50;
        }
        
        .cad-green { color: #4CAF50; }
        .bg-cad-green { background-color: #4CAF50; }
    </style>
</head>
<body class="flex h-screen w-screen">

    <!-- Sidebar -->
    <aside class="w-[320px] shrink-0 bg-[#1e1e1e] border-r border-[#333] flex flex-col h-full shadow-2xl z-10 p-5 overflow-y-auto">
        
        <!-- Header -->
        <div class="mb-5 border-b border-[#333] pb-4 shrink-0">
            <h1 class="text-xl font-bold cad-green uppercase tracking-wide">WallyCAD | FAN</h1>
            <p class="text-[10px] text-gray-500 mt-1 uppercase">Array-Polar // Space Trailer Engine</p>
        </div>

        <!-- Input Data -->
        <div class="flex flex-col h-[25vh] mb-5 shrink-0">
            <label class="block text-[10px] font-bold uppercase text-gray-400 mb-2">Source Geometry (Tags & Coordinates)</label>
            <textarea id="wallyInput" class="w-full flex-1 bg-[#121212] border border-[#333] rounded p-3 text-[11px] cad-green resize-none focus:border-[#4CAF50] outline-none leading-relaxed" spellcheck="false">[LINE] -2 0 2 0 4 4.4721 -4 4.4721 -2 0
[WALL] -2 0 -2 -4 2 -4 2 0</textarea>
        </div>

        <!-- Settings Grid -->
        <div class="space-y-4 mb-5 shrink-0">
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-[10px] uppercase text-gray-500 mb-1">Iterations (N)</label>
                    <input type="number" id="paramN" value="7" min="1">
                </div>
                <div>
                    <label class="block text-[10px] uppercase text-gray-500 mb-1">Step Angle (°)</label>
                    <input type="number" id="paramAngle" value="48.1884" step="0.0001">
                </div>
                <div>
                    <label class="block text-[10px] uppercase text-gray-500 mb-1">Pivot X (Pc)</label>
                    <input type="number" id="paramPivotX" value="0" step="0.1">
                </div>
                <div>
                    <label class="block text-[10px] uppercase text-gray-500 mb-1">Pivot Y (Pc)</label>
                    <input type="number" id="paramPivotY" value="-4.4721" step="0.0001">
                </div>
            </div>
            
            <div class="pt-2">
                <div class="flex justify-between items-center mb-1">
                    <label class="text-[10px] uppercase text-gray-500">Viewport Scale</label>
                    <span id="scaleValue" class="text-[10px] cad-green font-bold">20x</span>
                </div>
                <input type="range" id="paramScale" min="5" max="60" value="20" class="w-full accent-[#4CAF50]">
            </div>
        </div>

        <!-- Action Button -->
        <button id="btnExecute" class="w-full bg-cad-green hover:bg-[#3d8c40] text-black font-bold uppercase text-sm tracking-widest py-3 rounded transition-all active:scale-[0.98] mb-5 shrink-0 shadow-lg">
            Execute Array
        </button>

        <!-- Output Data -->
        <div class="flex-1 flex flex-col min-h-[150px]">
            <label class="block text-[10px] font-bold uppercase text-gray-400 mb-2">Trans-Rot Generated Output</label>
            <textarea id="wallyOutput" readonly class="w-full flex-1 bg-[#121212] border border-[#333] rounded p-3 text-[10px] text-[#ff8c00] resize-none focus:border-[#4CAF50] outline-none leading-relaxed" placeholder="Fanned geometry will output here..."></textarea>
        </div>
    </aside>

    <!-- Main Canvas -->
    <main id="canvasContainer" class="flex-1 relative cursor-crosshair bg-[#0a0a0a]">
        <canvas id="cadCanvas" class="block w-full h-full"></canvas>
        
        <!-- UI Overlay -->
        <div class="absolute top-4 right-4 bg-[#1e1e1e] px-4 py-2 rounded border border-[#333] shadow-lg pointer-events-none text-right">
            <div class="text-[10px] text-gray-500 uppercase tracking-wide mb-1">Coordinate Viewport</div>
            <div id="coordDisplay" class="text-xs font-bold cad-green">Origin Centered</div>
        </div>
    </main>

    <script>
        const canvas = document.getElementById('cadCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvasContainer');

        // UI Elements
        const inputData = document.getElementById('wallyInput');
        const inN = document.getElementById('paramN');
        const inAngle = document.getElementById('paramAngle');
        const inPivotX = document.getElementById('paramPivotX');
        const inPivotY = document.getElementById('paramPivotY');
        const inScale = document.getElementById('paramScale');
        const scaleValDisplay = document.getElementById('scaleValue');
        const outputData = document.getElementById('wallyOutput');
        const coordDisplay = document.getElementById('coordDisplay');
        
        let originX, originY;

        /**
         * Universal WallyCAD Parser
         * Tokenizes spaces, commas, and handles geometric tags properly.
         */
        function parseWallyData(inputString) {
            const tokens = inputString.trim().split(/[\s,]+/);
            const parsedGeometry = [];
            let currentSequence = { tag: "[UNTAGGED]", coordinates: [] };
            let tempX = null;

            tokens.forEach(token => {
                if (/^\[.*?\]$/.test(token)) {
                    if (currentSequence.coordinates.length > 0) parsedGeometry.push(currentSequence);
                    currentSequence = { tag: token, coordinates: [] };
                    tempX = null;
                } else {
                    const val = parseFloat(token);
                    if (!isNaN(val)) {
                        if (tempX === null) {
                            tempX = val;
                        } else {
                            currentSequence.coordinates.push({ x: tempX, y: val });
                            tempX = null; 
                        }
                    }
                }
            });
            if (currentSequence.coordinates.length > 0) parsedGeometry.push(currentSequence);
            return parsedGeometry;
        }

        // Resize Canvas and Redraw
        function resize() {
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            // Set drawing origin (CAD 0,0) near the bottom-center for fanning upward
            originX = canvas.width / 2;
            originY = canvas.height * 0.70;
            draw();
        }
        window.addEventListener('resize', resize);

        // Core Drawing and Rotation Engine
        function draw() {
            const N = parseInt(inN.value) || 1;
            const stepAngleDeg = parseFloat(inAngle.value) || 0;
            const pX = parseFloat(inPivotX.value) || 0;
            const pY = parseFloat(inPivotY.value) || 0;
            const scale = parseInt(inScale.value) || 20;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 1. Draw Cartesian Axes
            ctx.lineWidth = 1;
            ctx.strokeStyle = '#222';
            ctx.beginPath();
            ctx.moveTo(originX, 0); ctx.lineTo(originX, canvas.height);
            ctx.moveTo(0, originY); ctx.lineTo(canvas.width, originY);
            ctx.stroke();

            // 2. Draw Pivot Marker (Red)
            const pCanvasX = originX + (pX * scale);
            const pCanvasY = originY - (pY * scale); // CAD Y goes up, canvas Y goes down
            
            ctx.fillStyle = '#ef4444'; // Tailwind Red-500
            ctx.beginPath();
            ctx.arc(pCanvasX, pCanvasY, 4, 0, Math.PI * 2);
            ctx.fill();

            // Parse Raw Input Geometry
            const geometry = parseWallyData(inputData.value);
            if(geometry.length === 0) {
                outputData.value = "No valid coordinate geometry found.";
                return;
            }

            let generatedOutput = "";

            // 3. Array Rotation Loop
            for (let i = 0; i < N; i++) {
                const theta = i * (stepAngleDeg * Math.PI / 180);
                
                // Styling: Base element is CAD Green, arrays are Orange
                ctx.strokeStyle = (i === 0) ? '#4CAF50' : '#ff8c00';
                ctx.lineWidth = 2;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                geometry.forEach(layer => {
                    if (layer.coordinates.length < 2) return;

                    ctx.beginPath();
                    // Start formatting output tag for this iteration
                    generatedOutput += layer.tag;
                    
                    layer.coordinates.forEach((node, index) => {
                        // Apply 2D Rotation Matrix around (pX, pY)
                        const rotatedX = (node.x - pX) * Math.cos(theta) - (node.y - pY) * Math.sin(theta) + pX;
                        const rotatedY = (node.x - pX) * Math.sin(theta) + (node.y - pY) * Math.cos(theta) + pY;
                        
                        // Append formatted (4-decimal) coordinates to output string
                        generatedOutput += ` ${rotatedX.toFixed(4)} ${rotatedY.toFixed(4)}`;

                        // Map mathematically pure coordinates to Screen Canvas
                        const screenX = originX + (rotatedX * scale);
                        const screenY = originY - (rotatedY * scale);

                        if (index === 0) {
                            ctx.moveTo(screenX, screenY);
                        } else {
                            ctx.lineTo(screenX, screenY);
                        }
                    });
                    
                    generatedOutput += "\n";
                    ctx.stroke();
                });
                
                if (i < N - 1) generatedOutput += "\n"; // Space out iterations
            }
            
            // Push calculated values to UI
            outputData.value = generatedOutput.trim();
        }

        // Live Coordinate Tracker
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            
            const scale = parseInt(inScale.value) || 20;
            const cartesianX = (mouseX - originX) / scale;
            const cartesianY = (originY - mouseY) / scale;
            
            coordDisplay.textContent = `X: ${cartesianX.toFixed(2)}, Y: ${cartesianY.toFixed(2)}`;
        });
        canvas.addEventListener('mouseout', () => {
            coordDisplay.textContent = 'Origin Centered';
        });

        // Event Listeners
        document.getElementById('btnExecute').addEventListener('click', draw);
        inScale.addEventListener('input', (e) => {
            scaleValDisplay.textContent = e.target.value + 'x';
            draw();
        });

        // Initialize application
        setTimeout(resize, 100);
    </script>
</body>
</html>
