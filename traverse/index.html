<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WallyCAD | Traverse Engine</title>
    <style>
        body { background: #1a1a1a; color: #00ff00; font-family: monospace; display: flex; height: 100vh; margin: 0; overflow: hidden; }
        #control-pane { width: 300px; border-right: 1px solid #444; padding: 20px; display: flex; flex-direction: column; z-index: 10; background: #1a1a1a; }
        #canvas-pane { flex-grow: 1; background: #000; position: relative; cursor: grab; }
        #canvas-pane:active { cursor: grabbing; }
        canvas { width: 100%; height: 100%; display: block; }
        textarea { flex-grow: 1; background: #080808; color: #00ff00; border: 1px solid #333; padding: 10px; font-size: 12px; margin-top: 10px; resize: none; outline: none; }
        #cli { background: #080808; color: #00ff00; border: 1px solid #333; padding: 10px; font-size: 14px; font-family: monospace; font-weight: bold; margin-top: 5px; outline: none; text-transform: uppercase; }
        #cli:focus { border-color: #00ff00; }
        .stat { color: #fff; font-size: 14px; margin-bottom: 5px; }
        #qc-hud { position: absolute; bottom: 20px; left: 20px; background: rgba(0,0,0,0.8); padding: 10px; border: 1px solid #00ff00; pointer-events: none; }
    </style>
</head>
<body>

    <div id="control-pane">
        <h3>TRAVERSE ENGINE</h3>
        <div class="stat">P-Points: <span id="p-count">1</span></div>
        <div class="stat">Heading: <span id="heading-display">0°</span></div>
        
        <!-- Read-Only Log -->
        <textarea id="command-log" readonly placeholder="Traverse Log..."></textarea>
        
        <!-- Active Command Line -->
        <input type="text" id="cli" placeholder="Command (e.g. L 10)" autofocus autocomplete="off">
        
        <button onclick="exportToGist()" style="margin-top:10px; background:#00ff00; color:#000; font-weight:bold; border:none; padding:10px; cursor:pointer;">SYNC TO GIST</button>
    </div>

    <div id="canvas-pane">
        <canvas id="traverseCanvas"></canvas>
        <div id="qc-hud">CLI: [ L {dist} | R {dist} | T {dist},{angle} | E (Zoom Extents) ]<br>NAV: [ Scroll: Zoom | Click+Drag: Pan ]</div>
    </div>

<script>
    let points = [{x: 0, y: 0}];
    let currentHeading = 0; // 0 = East
    
    // Viewport Globals
    let scale = 20;
    let originX = 0;
    let originY = 0;
    let isPanning = false;
    let startPanX = 0;
    let startPanY = 0;

    const canvas = document.getElementById('traverseCanvas');
    const ctx = canvas.getContext('2d');
    const cli = document.getElementById('cli');

    function addMove(dist, deflection) {
        if (!dist || isNaN(dist)) return;
        currentHeading += deflection;
        const rad = currentHeading * (Math.PI / 180);
        const last = points[points.length - 1];
        
        const next = {
            x: last.x + dist * Math.cos(rad),
            y: last.y + dist * Math.sin(rad)
        };
        
        points.push(next);
        updateLog(dist, deflection);
        render();
    }

    function updateLog(dist, def) {
        const log = document.getElementById('command-log');
        const dir = def > 0 ? "LEFT" : (def < 0 ? "RIGHT" : "STRAIGHT");
        log.value += `P${points.length}: ${dist} units, ${dir} ${Math.abs(def)}°\n`;
        log.scrollTop = log.scrollHeight;
        document.getElementById('heading-display').innerText = `${currentHeading}°`;
        document.getElementById('p-count').innerText = points.length;
    }

    function zoomExtents() {
        if (points.length === 0) return;
        
        let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
        points.forEach(p => {
            if (p.x < minX) minX = p.x;
            if (p.x > maxX) maxX = p.x;
            if (p.y < minY) minY = p.y;
            if (p.y > maxY) maxY = p.y;
        });

        const padding = 40;
        const width = Math.max(maxX - minX, 1);
        const height = Math.max(maxY - minY, 1);

        const scaleX = (canvas.width - padding * 2) / width;
        const scaleY = (canvas.height - padding * 2) / height;
        scale = Math.min(scaleX, scaleY);

        const centerX = (minX + maxX) / 2;
        const centerY = (minY + maxY) / 2;

        originX = canvas.width / 2 - centerX * scale;
        originY = canvas.height / 2 + centerY * scale; // + because Y is inverted
        render();
    }

    // Active CLI Event Listener
    cli.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            const raw = cli.value.trim().toUpperCase();
            if (!raw) return;

            const parts = raw.split(/[\s,]+/);
            const cmd = parts[0];

            if (cmd === 'L' && parts[1]) {
                addMove(Number(parts[1]), 90);
            } else if (cmd === 'R' && parts[1]) {
                addMove(Number(parts[1]), -90);
            } else if (cmd === 'T' && parts[1] && parts[2]) {
                addMove(Number(parts[1]), Number(parts[2]));
            } else if (cmd === 'E') {
                zoomExtents();
            } else if (cmd === 'L' || cmd === 'R') {
                // Fallback prompt if they only type the letter without distance
                const def = cmd === 'L' ? 90 : -90;
                addMove(Number(prompt(`Distance ${cmd === 'L' ? 'Left' : 'Right'} 90°:`)), def);
            }
            
            cli.value = ''; // Clear the input field for the next command
        }
    });

    // Keep focus on CLI when clicking in the control pane
    document.getElementById('control-pane').addEventListener('click', () => {
        cli.focus();
    });

    // Panning & Zooming Listeners
    canvas.addEventListener('mousedown', (e) => {
        isPanning = true;
        startPanX = e.clientX - originX;
        startPanY = e.clientY - originY;
    });

    canvas.addEventListener('mousemove', (e) => {
        if (!isPanning) return;
        originX = e.clientX - startPanX;
        originY = e.clientY - startPanY;
        render();
    });

    canvas.addEventListener('mouseup', () => isPanning = false);
    canvas.addEventListener('mouseleave', () => isPanning = false);
    canvas.addEventListener('contextmenu', e => e.preventDefault());

    canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomFactor = 1.1;
        const wheel = e.deltaY < 0 ? 1 : -1;
        const zoom = Math.pow(zoomFactor, wheel);

        const rect = canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        originX = mouseX - (mouseX - originX) * zoom;
        originY = mouseY - (mouseY - originY) * zoom;
        scale *= zoom;

        render();
    });

    function render() {
        ctx.clearRect(0,0,canvas.width, canvas.height);
        
        ctx.strokeStyle = '#00ff00';
        ctx.lineWidth = 2;
        ctx.beginPath();
        
        points.forEach((p, i) => {
            const screenX = originX + p.x * scale;
            const screenY = originY - p.y * scale;
            
            if (i === 0) {
                ctx.moveTo(screenX, screenY);
                ctx.fillStyle = '#ff0000';
                ctx.fillRect(screenX - 3, screenY - 3, 6, 6);
            }
            else {
                ctx.lineTo(screenX, screenY);
                ctx.fillStyle = '#00ff00';
                ctx.fillRect(screenX - 2, screenY - 2, 4, 4);
            }
        });
        ctx.stroke();
    }

    // Initialize Canvas
    window.onresize = () => { 
        canvas.width = canvas.clientWidth; 
        canvas.height = canvas.clientHeight; 
        if (points.length === 1 && points[0].x === 0 && points[0].y === 0) {
            originX = canvas.width / 2;
            originY = canvas.height / 2;
        }
        render(); 
    };
    window.onresize();
</script>
</body>
</html>
