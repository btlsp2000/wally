<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WallyCAD - Loading</title>
    <script>
        /**
         * 1. Index Entry Point
         * This script runs immediately when /index.html is loaded.
         */
        document.addEventListener('DOMContentLoaded', () => {
            determineRoute();
        });

        /**
         * 2. "ROUTE TO" Block & Side Loop
         * Evaluates conditions (like saved preferences or auth) before routing.
         * The side loop [ ___ ] is represented here by the preference check.
         */
        function determineRoute() {
            // Example side-loop logic: Check if user has a saved version preference
            const savedVersion = localStorage.getItem('wallycad_version');
            const latestVersion = '/v17'; 
            
            let targetPath = savedVersion ? savedVersion : latestVersion;
            
            dispatchRoute(targetPath);
        }

        /**
         * 3. The Dispatcher (Blank rectangular node) & Version Branches
         * Takes the determined path and branches into the specific directories.
         */
        function dispatchRoute(path) {
            console.log(`Routing user to: ${path}`);

            switch(path) {
                case '/v17':
                    // Leftmost box: Redirects to the v17 application
                    window.location.replace('/v17/'); 
                    break;
                case '/v16':
                    // Middle box (Example legacy branch)
                    window.location.replace('/v16/');
                    break;
                case '/beta':
                    // Rightmost box (Example beta branch)
                    window.location.replace('/beta/');
                    break;
                default:
                    // Fallback to the primary /v17 route
                    window.location.replace('/v17/');
                    break;
            }
        }
    </script>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f9;
            color: #333;
        }
    </style>
</head>
<body>
    <div id="loader">
        <p>Routing to WallyCAD...</p>
    </div>
</body>
</html>
