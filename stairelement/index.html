<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WallyCAD - Stair Element Solver</title>
    <style>
        body {
            font-family: monospace;
            background-color: #1e1e1e;
            color: #d4d4d4;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: auto;
        }
        h1 {
            font-size: 1.5rem;
            color: #4ec9b0;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }
        .controls, .cli-panel {
            background: #252526;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 15px;
            border: 1px solid #333;
        }
        label {
            display: inline-block;
            width: 30px;
            font-weight: bold;
            color: #9cdcfe;
        }
        input[type="number"] {
            background: #3c3c3c;
            color: #fff;
            border: 1px solid #555;
            padding: 5px;
            width: 80px;
            margin-right: 20px;
        }
        button {
            background: #0e639c;
            color: white;
            border: none;
            padding: 6px 14px;
            cursor: pointer;
            font-family: monospace;
        }
        button:hover {
            background: #1177bb;
        }
        canvas {
            background: #111;
            border: 1px solid #444;
            display: block;
            margin-bottom: 15px;
        }
        .cli-input {
            width: 100%;
            background: #1e1e1e;
            color: #ce9178;
            border: 1px solid #333;
            padding: 8px;
            font-family: monospace;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>WallyCAD v1.0.10 // Geometric Engine</h1>
    
    <div class="controls">
        <label for="paramA">a:</label>
        <input type="number" id="paramA" value="200" min="10">
        <label for="paramB">b:</label>
        <input type="number" id="paramB" value="80" min="5">
        <button onclick="renderStair()">Generate Element</button>
    </div>

    <canvas id="cadCanvas" width="760" height="400"></canvas>

    <div class="cli-panel">
        <label for="cli">CLI:</label>
        <input type="text" id="cli" class="cli-input" value="STAIR_ELEM a=200 b=80" readonly>
    </div>
</div>

<script>
function solveStairElement(a, b) {
    return {
        vertices: [
            { x: 0, y: 0 },
            { x: a, y: 0 },
            { x: a, y: b / 2 },
            { x: a - b, y: b },
            { x: 0, y: b }
        ]
    };
}

function renderStair() {
    const canvas = document.getElementById('cadCanvas');
    const ctx = canvas.getContext('2d');
    
    const a = parseFloat(document.getElementById('paramA').value);
    const b = parseFloat(document.getElementById('paramB').value);
    
    // Clear canvas
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Grid lines (WallyCAD background style)
    ctx.strokeStyle = '#222';
    ctx.lineWidth = 1;
    for (let x = 0; x < canvas.width; x += 20) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
    }
    for (let y = 0; y < canvas.height; y += 20) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
    }

    const geom = solveStairElement(a, b);
    
    // Scaling and centering translation
    const scale = 1.5;
    const offsetX = 150;
    const offsetY = 250;

    // Draw Shape
    ctx.beginPath();
    geom.vertices.forEach((v, index) => {
        const cx = offsetX + (v.x * scale);
        const cy = offsetY - (v.y * scale); // Invert Y for screen coords
        if (index === 0) ctx.moveTo(cx, cy);
        else ctx.lineTo(cx, cy);
    });
    ctx.closePath();
    
    ctx.fillStyle = 'rgba(78, 201, 176, 0.15)';
    ctx.fill();
    ctx.strokeStyle = '#4ec9b0';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Draw Vertex Points & Coordinates
    ctx.fillStyle = '#dcdcaa';
    geom.vertices.forEach(v => {
        const cx = offsetX + (v.x * scale);
        const cy = offsetY - (v.y * scale);
        ctx.beginPath();
        ctx.arc(cx, cy, 3, 0, Math.PI * 2);
        ctx.fill();
    });

    // Update CLI text view
    document.getElementById('cli').value = `STAIR_ELEM a=${a} b=${b} [VERTS:${geom.vertices.length}]`;
}

// Initial render execution
renderStair();
</script>

</body>
</html>
