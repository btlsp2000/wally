<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Series Module</title>
    <style>
        body {
            background-color: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .video-container {
            position: relative;
            width: 80%;
            max-width: 960px;
            /* 16:9 Aspect Ratio calculation */
            padding-bottom: 45%; 
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 2px solid #333;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div class="video-container">
        <!-- Corrected: Only using the 11-character Video IDs -->
        <iframe 
            src="https://www.youtube.com/embed/6ieGT1XZ0oc?playlist=O7c9AZ3-AwU,3dvWghk1mf0,z7esE31jmd8&rel=0" 
            title="Video Series" 
            frameborder="0" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
        </iframe>
    </div>

</body>
</html>
