<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Interactive Pool Shots Diagrammer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #e0f2fe; /* Tailwind sky-100, light pastel blue */
            color: #1f2937; /* Tailwind gray-800 */
            font-family: 'Inter', sans-serif;
            touch-action: none; /* Prevent scrolling when dragging on canvas */
            margin: 0;
        }
        #app-container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }
        #sidebar {
            width: 300px;
            background-color: #ffffff;
            box-shadow: 2px 0 10px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            z-index: 10;
            flex-shrink: 0;
        }
        #main-area {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            overflow: hidden;
            position: relative;
        }
        #canvas-container {
            position: relative;
            width: 100%;
            max-width: 1000px;
            aspect-ratio: 2 / 1;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            border-radius: 12px;
            overflow: hidden;
            background-color: #3b2415; /* Wood color fallback */
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }
        .btn-active {
            background-color: #3b82f6 !important; /* Blue-500 */
            color: white !important;
            border-color: #2563eb !important; /* Blue-600 */
        }
        .btn-active svg {
            stroke: white !important;
        }
    </style>
</head>
<body class="font-sans antialiased text-gray-800 bg-sky-50">

    <div id="app-container">
        <aside id="sidebar">
            <header class="mb-6">
                <h1 class="text-2xl font-bold text-gray-900 tracking-tight">Pool Shots<br>Diagrammer</h1>
                <p class="text-gray-500 text-sm mt-1">Plan your shots and export data.</p>
            </header>

            <div class="flex flex-col gap-2" id="toolbar">
                <button id="btn-cue1" class="toolbar-btn px-4 py-2 bg-white border border-gray-300 rounded-md hover:bg-gray-50 transition font-medium shadow-sm flex items-center gap-2 text-gray-700 text-sm">
                    <div class="w-4 h-4 rounded-full bg-white border border-gray-400"></div>
                    Place Cue Ball 1
                </button>
                <button id="btn-cue2" class="toolbar-btn px-4 py-2 bg-white border border-gray-300 rounded-md hover:bg-gray-50 transition font-medium shadow-sm flex items-center gap-2 text-gray-700 text-sm">
                    <div class="w-4 h-4 rounded-full bg-yellow-100 border border-yellow-500"></div>
                    Place Cue Ball 2
                </button>
                <button id="btn-object" class="toolbar-btn px-4 py-2 bg-white border border-gray-300 rounded-md hover:bg-gray-50 transition font-medium shadow-sm flex items-center gap-2 text-gray-700 text-sm">
                    <div class="w-4 h-4 rounded-full bg-red-500 border border-red-700 shadow-inner"></div>
                    Place Object Ball
                </button>
                <button id="btn-draw" class="toolbar-btn px-4 py-2 bg-white border border-gray-300 rounded-md hover:bg-gray-50 transition font-medium shadow-sm flex items-center gap-2 text-gray-700 text-sm">
                    <svg class="w-4 h-4 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                    Draw Path
                </button>
                <hr class="my-3 border-gray-200">
                <button id="btn-clear" class="px-4 py-2 bg-red-50 border border-red-200 rounded-md hover:bg-red-100 transition font-medium shadow-sm text-red-700 text-sm">
                    Clear Board
                </button>
            </div>

            <div class="mt-auto flex flex-col h-1/3 min-h-[200px]">
                <label class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">.wally Data Readout</label>
                <textarea id="wally-readout" readonly class="w-full flex-grow p-3 bg-gray-900 text-green-400 font-mono text-xs rounded-md shadow-inner resize-none focus:outline-none border border-gray-700 whitespace-pre"></textarea>
            </div>
        </aside>

        <main id="main-area">
            <div id="canvas-container">
                <canvas id="poolCanvas"></canvas>
            </div>
            <p class="absolute bottom-4 left-1/2 transform -translate-x-1/2 text-gray-500 text-xs text-center max-w-lg hidden md:block">
                Select a tool on the left. Click/tap on the table to place balls. Click and drag to draw directional paths.
            </p>
        </main>
    </div>

    <script>
        const canvas = document.getElementById('poolCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');
        const readout = document.getElementById('wally-readout');

        // State
        let mode = 'cue1'; // 'cue1', 'cue2', 'object', 'draw'
        let cueBall1 = null; // {x, y}
        let cueBall2 = null; // {x, y}
        let objectBalls = []; // array of {x, y, color}
        let paths = []; // array of {startX, startY, endX, endY}
        
        let isDrawing = false;
        let drawStart = { x: 0, y: 0 };
        let drawCurrent = { x: 0, y: 0 };

        // Colors for object balls
        const ballColors = ['#ef4444', '#eab308', '#3b82f6', '#a855f7', '#f97316', '#22c55e', '#7f1d1d', '#111827'];

        // Resize handler
        function resizeCanvas() {
            const rect = container.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            render();
        }

        window.addEventListener('resize', resizeCanvas);

        // Coordinates mapping
        function getMousePos(evt) {
            const rect = canvas.getBoundingClientRect();
            let clientX = evt.clientX;
            let clientY = evt.clientY;

            if (evt.touches && evt.touches.length > 0) {
                clientX = evt.touches[0].clientX;
                clientY = evt.touches[0].clientY;
            }

            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        // Toolbar Interaction
        const buttons = {
            'cue1': document.getElementById('btn-cue1'),
            'cue2': document.getElementById('btn-cue2'),
            'object': document.getElementById('btn-object'),
            'draw': document.getElementById('btn-draw')
        };

        function setMode(newMode) {
            mode = newMode;
            Object.values(buttons).forEach(btn => btn.classList.remove('btn-active'));
            buttons[mode].classList.add('btn-active');
            
            if (mode === 'draw') canvas.style.cursor = 'crosshair';
            else canvas.style.cursor = 'pointer';
        }

        document.getElementById('btn-cue1').addEventListener('click', () => setMode('cue1'));
        document.getElementById('btn-cue2').addEventListener('click', () => setMode('cue2'));
        document.getElementById('btn-object').addEventListener('click', () => setMode('object'));
        document.getElementById('btn-draw').addEventListener('click', () => setMode('draw'));
        
        document.getElementById('btn-clear').addEventListener('click', () => {
            cueBall1 = null;
            cueBall2 = null;
            objectBalls = [];
            paths = [];
            render();
        });

        setMode('cue1');

        // Canvas Events
        function handleStart(e) {
            e.preventDefault();
            const pos = getMousePos(e);
            
            if (mode === 'cue1') {
                cueBall1 = { x: pos.x, y: pos.y };
                render();
            } else if (mode === 'cue2') {
                cueBall2 = { x: pos.x, y: pos.y };
                render();
            } else if (mode === 'object') {
                const color = ballColors[objectBalls.length % ballColors.length];
                objectBalls.push({ x: pos.x, y: pos.y, color: color });
                render();
            } else if (mode === 'draw') {
                isDrawing = true;
                drawStart = pos;
                drawCurrent = pos;
            }
        }

        function handleMove(e) {
            if (!isDrawing || mode !== 'draw') return;
            e.preventDefault();
            drawCurrent = getMousePos(e);
            render();
        }

        function handleEnd(e) {
            if (!isDrawing || mode !== 'draw') return;
            e.preventDefault();
            isDrawing = false;
            
            const dist = Math.hypot(drawCurrent.x - drawStart.x, drawCurrent.y - drawStart.y);
            if (dist > 5) {
                paths.push({
                    startX: drawStart.x,
                    startY: drawStart.y,
                    endX: drawCurrent.x,
                    endY: drawCurrent.y
                });
            }
            render();
        }

        canvas.addEventListener('mousedown', handleStart);
        canvas.addEventListener('mousemove', handleMove);
        canvas.addEventListener('mouseup', handleEnd);
        canvas.addEventListener('mouseleave', handleEnd);

        canvas.addEventListener('touchstart', handleStart, {passive: false});
        canvas.addEventListener('touchmove', handleMove, {passive: false});
        canvas.addEventListener('touchend', handleEnd);

        function generateWallyData() {
            const w = canvas.width;
            const h = canvas.height;
            
            // Normalize coordinates relative to table size (0 to 1) for .wally format
            const normX = (val) => (val / w).toFixed(4);
            const normY = (val) => (val / h).toFixed(4);

            let data = "FORMAT: .wally/1.0\n";
            data += "TABLE_ASPECT: 2.0\n\n";
            
            if (cueBall1) data += `CUE_BALL_1: [${normX(cueBall1.x)}, ${normY(cueBall1.y)}]\n`;
            if (cueBall2) data += `CUE_BALL_2: [${normX(cueBall2.x)}, ${normY(cueBall2.y)}]\n`;
            
            if (objectBalls.length > 0) {
                data += `\nOBJECT_BALLS:\n`;
                objectBalls.forEach((b, i) => {
                    data += `  BALL_${i+1}: [${normX(b.x)}, ${normY(b.y)}]\n`;
                });
            }
            
            if (paths.length > 0) {
                data += `\nVECTOR_PATHS:\n`;
                paths.forEach((p, i) => {
                    data += `  PATH_${i+1}: START[${normX(p.startX)}, ${normY(p.startY)}] -> END[${normX(p.endX)}, ${normY(p.endY)}]\n`;
                });
            }
            
            if (!cueBall1 && !cueBall2 && objectBalls.length === 0 && paths.length === 0) {
                data += "TABLE_STATE: EMPTY\n";
            }

            readout.value = data;
        }

        // Drawing Logic
        function render() {
            const w = canvas.width;
            const h = canvas.height;
            const railSize = w * 0.05;
            const cushionSize = railSize * 0.5;

            ctx.clearRect(0, 0, w, h);

            ctx.fillStyle = '#4a2f1d';
            ctx.fillRect(0, 0, w, h);
            
            ctx.fillStyle = '#654321';
            ctx.fillRect(railSize*0.2, railSize*0.2, w - railSize*0.4, h - railSize*0.4);

            ctx.fillStyle = '#107a47'; // Classic green
            ctx.fillRect(railSize, railSize, w - railSize * 2, h - railSize * 2);

            ctx.strokeStyle = '#0c5c35';
            ctx.lineWidth = cushionSize;
            ctx.strokeRect(railSize + cushionSize/2, railSize + cushionSize/2, w - railSize*2 - cushionSize, h - railSize*2 - cushionSize);

            const pocketRadius = w * 0.025;
            const pocketPositions = [
                {x: railSize, y: railSize},
                {x: w / 2, y: railSize},
                {x: w - railSize, y: railSize},
                {x: railSize, y: h - railSize},
                {x: w / 2, y: h - railSize},
                {x: w - railSize, y: h - railSize},
            ];

            ctx.fillStyle = '#111';
            pocketPositions.forEach(pos => {
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, pocketRadius, 0, Math.PI * 2);
                ctx.fill();
            });

            paths.forEach(p => drawArrow(p.startX, p.startY, p.endX, p.endY, 'white'));
            
            if (isDrawing && mode === 'draw') {
                drawArrow(drawStart.x, drawStart.y, drawCurrent.x, drawCurrent.y, 'rgba(255, 255, 255, 0.6)');
            }

            const ballRadius = w * 0.012;
            objectBalls.forEach(ball => {
                drawBall(ball.x, ball.y, ballRadius, ball.color);
            });

            if (cueBall1) {
                drawBall(cueBall1.x, cueBall1.y, ballRadius, '#ffffff', true);
            }
            if (cueBall2) {
                drawBall(cueBall2.x, cueBall2.y, ballRadius, '#fef08a', true); // yellowish/off-white
            }

            generateWallyData();
        }

        function drawBall(x, y, radius, color, isCue = false) {
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
            
            ctx.beginPath();
            ctx.arc(x - radius*0.3, y - radius*0.3, radius*0.3, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.fill();

            ctx.lineWidth = 1;
            ctx.strokeStyle = isCue ? 'rgba(0,0,0,0.3)' : 'rgba(0,0,0,0.6)';
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(x, y + radius*0.2, radius, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.fill();
        }

        function drawArrow(fromX, fromY, toX, toY, color) {
            const headlen = 10;
            const dx = toX - fromX;
            const dy = toY - fromY;
            const angle = Math.atan2(dy, dx);
            
            ctx.beginPath();
            ctx.moveTo(fromX, fromY);
            ctx.lineTo(toX, toY);
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(toX, toY);
            ctx.lineTo(toX - headlen * Math.cos(angle - Math.PI / 6), toY - headlen * Math.sin(angle - Math.PI / 6));
            ctx.moveTo(toX, toY);
            ctx.lineTo(toX - headlen * Math.cos(angle + Math.PI / 6), toY - headlen * Math.sin(angle + Math.PI / 6));
            ctx.stroke();
        }

        setTimeout(resizeCanvas, 100);
    </script>
</body>
</html>
