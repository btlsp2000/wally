<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WallyCAD | Arc Generator & Tuple Engine</title>
    <style>
        body { background: #1a1a1a; color: #00ff00; font-family: monospace; padding: 20px; }
        .input-group { margin-bottom: 15px; }
        label { display: inline-block; width: 120px; color: #fff; font-weight: bold; }
        input { background: #000; color: #00ff00; border: 1px solid #444; padding: 5px; width: 100px; font-family: monospace; }
        .output-container { display: flex; gap: 20px; margin-top: 15px; }
        .output-box { flex: 1; }
        textarea { width: 100%; height: 250px; background: #000; color: #00ff00; border: 1px solid #444; padding: 10px; margin-top: 5px; box-sizing: border-box; }
        button { background: #00ff00; color: #000; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; margin-top: 10px; font-size: 16px; }
        button:hover { background: #00cc00; }
        .label-text { color: #fff; font-weight: bold; display: block; margin-bottom: 5px; }
    </style>
</head>
<body>

    <h2>WALLY ARC GENERATOR</h2>
    
    <div class="input-group">
        <label>Center X (Cx):</label>
        <input type="number" id="cx" value="0" step="any">
        
        <label style="margin-left:20px;">Center Y (Cy):</label>
        <input type="number" id="cy" value="0" step="any">
    </div>

    <div class="input-group">
        <label>Radius (R):</label>
        <input type="number" id="radius" value="5" step="any">
    </div>

    <div class="input-group">
        <label>Start Angle (°):</label>
        <input type="number" id="startAngle" value="0" step="any">
        
        <label style="margin-left:20px;">End Angle (°):</label>
        <input type="number" id="endAngle" value="90" step="any">
    </div>

    <div class="input-group">
        <label>Segments:</label>
        <input type="number" id="segments" value="12" step="1">
    </div>
    
    <button onclick="generateArc()">GENERATE ARC DATA</button>

    <div class="output-container">
        <div class="output-box">
            <span class="label-text">OUTPUT 1: Raw SDJ (Machine/Gist)</span>
            <textarea id="wallyOutputSDJ" readonly></textarea>
            <button onclick="copyToClipboard('wallyOutputSDJ')" style="width:100%; padding: 5px; font-size: 12px;">COPY SDJ</button>
        </div>
        
        <div class="output-box">
            <span class="label-text">OUTPUT 2: Column of Tuples (Human/Verify)</span>
            <textarea id="wallyOutputTuples" readonly></textarea>
            <button onclick="copyToClipboard('wallyOutputTuples')" style="width:100%; padding: 5px; font-size: 12px;">COPY TUPLES</button>
        </div>
    </div>

    <script>
        function generateArc() {
            const cx = parseFloat(document.getElementById('cx').value);
            const cy = parseFloat(document.getElementById('cy').value);
            const radius = parseFloat(document.getElementById('radius').value);
            const startAngleDeg = parseFloat(document.getElementById('startAngle').value);
            const endAngleDeg = parseFloat(document.getElementById('endAngle').value);
            const segments = parseInt(document.getElementById('segments').value);
            
            let arcNodesSDJ = [];
            let arcNodesTuples = [];
            const toRadians = Math.PI / 180;
            let startRad = startAngleDeg * toRadians;
            let endRad = endAngleDeg * toRadians;
            
            let sweepRad = endRad - startRad;
            let stepRad = sweepRad / segments;

            // Engine loop: calculating both formats simultaneously
            for (let i = 0; i <= segments; i++) {
                let currentTheta = startRad + (i * stepRad);
                let x = cx + radius * Math.cos(currentTheta);
                let y = cy + radius * Math.sin(currentTheta);
                
                let formatX = x.toFixed(4);
                let formatY = y.toFixed(4);
                
                // Machine format: Continuous string
                arcNodesSDJ.push(`${formatX} ${formatY}`);
                
                // Human format: (X, Y) tuple per line
                arcNodesTuples.push(`(${formatX}, ${formatY})`);
            }
            
            document.getElementById('wallyOutputSDJ').value = arcNodesSDJ.join(' ');
            document.getElementById('wallyOutputTuples').value = arcNodesTuples.join('\n');
        }

        function copyToClipboard(elementId) {
            const textToCopy = document.getElementById(elementId).value;
            if (!textToCopy) return;
            
            navigator.clipboard.writeText(textToCopy).then(() => {
                console.log("Copied " + elementId + " to clipboard.");
            }).catch(err => {
                console.error("Clipboard write failed: ", err);
            });
        }
    </script>
</body>
</html>
