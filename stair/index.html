<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WallyCAD | Stair Q-2-3</title>
    <style>
        body { 
            font-family: 'Courier New', monospace; 
            background: #121212; 
            color: #00ff00; 
            margin: 0; 
            display: flex; 
            height: 100vh; 
            overflow: hidden; 
        }
        #sidebar { 
            width: 320px; 
            padding: 20px; 
            background: #1a1a1a; 
            border-right: 1px solid #333; 
            display: flex; 
            flex-direction: column; 
        }
        #workspace { 
            flex-grow: 1; 
            position: relative; 
            background: #000; 
        }
        canvas { 
            width: 100%; 
            height: 100%; 
            display: block; 
        }
        h2 { margin-top: 0; color: #0f0; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .label-group { margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        input { background: #000; color: #0f0; border: 1px solid #0f0; width: 65px; padding: 4px; font-family: monospace; }
        button { 
            background: #00ff00; 
            color: #000; 
            border: none; 
            padding: 10px; 
            cursor: pointer; 
            font-weight: bold; 
            margin-top: 10px; 
            margin-bottom: 15px; 
        }
        button:hover { background: #00cc00; }
        textarea { 
            flex-grow: 1; 
            background: #000; 
            color: #fff; 
            border: 1px solid #444; 
            font-family: monospace; 
            font-size: 13px; 
            padding: 10px; 
            resize: none; 
        }
    </style>
</head>
<body>

<div id="sidebar">
    <h2>/stair-q-2-3</h2>
    <div class="label-group"><span>Treads (H):</span> <input type="number" id="H" value="6"></div>
    <div class="label-group"><span>Rise (a):</span>   <input type="number" id="a" value="7"></div>
    <div class="label-group"><span>Depth (b):</span>  <input type="number" id="b" value="11"></div>
    <div class="label-group"><span>Thick (t):</span>  <input type="number" id="t" value="2"></div>
    
    <button onclick="executeStairLogic()">Generate & Draw</button>
    <textarea id="output" readonly placeholder="Output [LINE] string will appear here..."></textarea>
</div>

<div id="workspace">
    <canvas id="wallyCanvas"></canvas>
</div>

<script>
    const canvas = document.getElementById('wallyCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function executeStairLogic() {
        const H = parseInt(document.getElementById('H').value);
        const a = parseFloat(document.getElementById('a').value);
        const b = parseFloat(document.getElementById('b').value);
        const t = parseFloat(document.getElementById('t').value);
        
        let x = 0, y = 0;
        let pts = [[0, 0]]; // Start (Pt 1)

        // --- FORWARD PASS (Treads & Risers) ---
        for (let n = 1; n <= H; n++) {
            x += b;
            pts.push([x, y]); // Move Horizontal
            
            let isUp = (n % 2 !== 0);
            y += (isUp ? a : -a); 
            pts.push([x, y]); // Move Vertical
        }

        // --- THE TURNAROUND (Structural Offset) ---
        y -= t; 
        pts.push([x, y]);

        // --- REVERSE PASS (The Counter Pattern) ---
        for (let n = H; n >= 1; n--) {
            x -= b;
            pts.push([x, y]); // Move Horizontal Back
            
            let isUp = (n % 2 !== 0);
            y += (isUp ? -a : a);
            
            if (x > 0 || y !== 0) {
                pts.push([x, y]);
            }
        }

        // Final closure to ensure the polyline hits (0,0) exactly
        if (pts[pts.length-1][0] !== 0 || pts[pts.length-1][1] !== 0) {
            pts.push([0, 0]);
        }

        // Format: Prepend with [LINE] for the Universal Parser
        let wallyString = "[LINE]\n" + pts.map(p => `${p[0].toFixed(4)} ${p[1].toFixed(4)}`).join('\n');
        document.getElementById('output').value = wallyString;

        drawToCanvas(pts);
    }

    function drawToCanvas(pts) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (pts.length === 0) return;

        // Auto-scaling math to fit the profile nicely in the viewport
        let minX = Math.min(...pts.map(p => p[0]));
        let maxX = Math.max(...pts.map(p => p[0]));
        let minY = Math.min(...pts.map(p => p[1]));
        let maxY = Math.max(...pts.map(p => p[1]));

        let padding = 50;
        let scaleX = (canvas.width - padding * 2) / (maxX - minX || 1);
        let scaleY = (canvas.height - padding * 2) / (maxY - minY || 1);
        let scale = Math.min(scaleX, scaleY);

        let offsetX = (canvas.width - (maxX - minX) * scale) / 2 - minX * scale;
        let offsetY = canvas.height - (canvas.height - (maxY - minY) * scale) / 2 + minY * scale;

        // Draw grid lines
        ctx.strokeStyle = '#222';
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let i = 0; i < canvas.width; i += 50) { ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); }
        for (let i = 0; i < canvas.height; i += 50) { ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); }
        ctx.stroke();

        // Draw profile
        ctx.strokeStyle = '#00ff00';
        ctx.lineWidth = 2;
        ctx.beginPath();
        
        pts.forEach((p, index) => {
            let cx = p[0] * scale + offsetX;
            let cy = offsetY - (p[1] * scale); // Invert Y for Cartesian display
            if (index === 0) ctx.moveTo(cx, cy);
            else ctx.lineTo(cx, cy);
        });
        
        ctx.stroke();
        
        // Highlight start/end node
        ctx.fillStyle = '#ff8c00';
        ctx.beginPath();
        ctx.arc(pts[0][0] * scale + offsetX, offsetY - (pts[0][1] * scale), 5, 0, Math.PI * 2);
        ctx.fill();
    }

    // Run once on load to populate
    executeStairLogic();
</script>

</body>
</html>
