<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embedded Presentation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.8rem;
            text-align: center;
        }

        /* Responsive Container for the Slides (16:9 Aspect Ratio) */
        .slides-container {
            position: relative;
            width: 100%;
            max-width: 960px;
            padding-bottom: 56.25%; /* Keeps the 16:9 ratio */
            height: 0;
            overflow: hidden;
            background: #000;
            border-radius: 10px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
        }

        .slides-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .description {
            margin-top: 15px;
            color: #666;
            font-size: 0.95rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>My Embedded Presentation</h1>

    <!-- Responsive Presentation Wrapper using your specific link -->
    <div class="slides-container">
        <iframe 
            src="https://docs.google.com/presentation/d/e/2PACX-1vS316AbehUFzl6mYS4v8KiNMv1Qw1_19miWHg4W1uZ-kPJTb5a0Sc3phCKqU81OYrdpyVX8AROUW7BL/embed?start=false&loop=false&delayms=3000" 
            allowfullscreen="true" 
            mozallowfullscreen="true" 
            webkitallowfullscreen="true">
        </iframe>
    </div>

    <p class="description">Use the controls at the bottom of the slides to navigate or go fullscreen.</p>

</body>
</html>
