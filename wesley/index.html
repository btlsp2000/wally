<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost Wesley | Route Two /photo-story</title>
    <style>
        /* Base layout & typography */
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #fafafa;
            color: #222;
            margin: 0;
            padding: 2rem;
        }
        
        /* Route Two Navigation */
        .nav-bar {
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #ccc;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .nav-bar a {
            color: #555;
            text-decoration: none;
            margin-right: 1.5rem;
        }
        .nav-bar a:hover {
            color: #000;
        }

        /* Header Section */
        header h1 {
            font-size: 2.5rem;
            margin: 0 0 0.5rem 0;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        header p.dates {
            font-style: italic;
            color: #666;
            margin-top: 0;
            margin-bottom: 2rem;
        }

        /* CSS Grid for Photo Story */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
            align-items: start;
        }

        /* Card Styling */
        .photo-card {
            background: #fff;
            padding: 1rem;
            border: 1px solid #eee;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .photo-card img {
            width: 100%;
            height: auto;
            display: block;
            background-color: #e0e0e0; /* Gray placeholder while images load */
            aspect-ratio: 4/3;
            object-fit: cover;
        }
        .caption {
            margin-top: 1rem;
            font-size: 0.95rem;
            line-height: 1.4;
            color: #444;
        }
    </style>
</head>
<body>

    <div class="nav-bar">
        <a href="/route-two">Route Two</a>
        <a href="/photo-story">/photo-story</a>
        <a href="/photo-story/wesley">/wesley</a>
    </div>

    <header>
        <h1>Lost Wesley</h1>
        <p class="dates">1977 &ndash; April 2022</p>
    </header>

    <main class="photo-grid">
        
        <!-- Grid Item 1 -->
        <div class="photo-card">
            <!-- Replace src with actual Route Two directory image paths -->

            </div>
        </div>

    </main>

</body>
</html>
