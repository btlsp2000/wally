  <style>
    :root {
      --bg: #f8f5ee;
      --card: #fffdf9;
      --ink: #1a1917;
      --muted: #5a554c;
      --rule: #2b2925;
      --light-rule: #d6cfc2;
      --red: #9C2A20;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #eae4d7;
      color: var(--ink);
      font-family: "Georgia", serif;
      line-height: 1.68;
      padding: 18px 12px;
    }

    .container {
      max-width: 920px;
      margin: 0 auto;
      background: var(--bg);
      border: 2px solid var(--rule);
      padding: 24px 28px;
    }

    /* Header */
    header {
      text-align: center;
      border-bottom: 3px double var(--rule);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }

    header h1 {
      font-family: monospace;
      font-size: clamp(2rem, 5vw, 3rem);
      letter-spacing: 0.12em;
    }

    .subtitle {
      font-family: monospace;
      font-size: 0.85rem;
      color: var(--red);
      text-transform: uppercase;
      letter-spacing: 0.15em;
      margin-top: 2px;
    }

    /* Funnel Filter & Quick-Jump Bar */
    .funnel-controls {
      background: var(--card);
      border: 1px solid var(--rule);
      padding: 12px;
      margin-bottom: 20px;
    }

    .search-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    #search-input {
      flex: 1;
      padding: 8px 10px;
      font-family: monospace;
      font-size: 0.9rem;
      border: 1px solid var(--rule);
      background: var(--bg);
      color: var(--ink);
    }

    .pill-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      font-family: monospace;
    }

    .pill {
      background: var(--bg);
      border: 1px solid var(--rule);
      color: var(--ink);
      font-family: monospace;
      font-size: 0.8rem;
      font-weight: bold;
      padding: 4px 10px;
      cursor: pointer;
    }

    .pill:hover { border-color: var(--red); color: var(--red); }
    .pill.active { background: var(--red); border-color: var(--red); color: #fff; }
    .pill.hidden { display: none; }

    /* Reader Area */
    .meta-line {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
      font-family: monospace;
      font-size: 0.78rem;
      color: var(--red);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .reader-title {
      font-size: clamp(1.55rem, 3.2vw, 2.2rem);
      line-height: 1.2;
      margin-bottom: 8px;
    }

    .reader-deck {
      font-style: italic;
      color: var(--muted);
      border-bottom: 1px solid var(--light-rule);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }

    .reader-body p {
      margin-bottom: 14px;
    }

    .pull-quote {
      border-left: 4px solid var(--red);
      padding-left: 16px;
      margin: 18px 0;
      font-style: italic;
      font-size: 1.15rem;
      color: var(--red);
    }

    /* Sequential Prev/Next Bar */
    .seq-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 24px;
      padding-top: 14px;
      border-top: 1px solid var(--light-rule);
      font-family: monospace;
      font-size: 0.85rem;
    }

    .seq-btn {
      background: var(--card);
      border: 1px solid var(--rule);
      padding: 6px 12px;
      font-family: monospace;
      font-weight: bold;
      cursor: pointer;
    }

    .seq-btn:hover { background: var(--rule); color: #fff; }

    /* Footer */
    footer {
      margin-top: 24px;
      padding-top: 12px;
      border-top: 2px solid var(--rule);
      text-align: center;
      font-family: monospace;
      font-size: 0.78rem;
      color: var(--muted);
    }

    footer a {
      color: var(--red);
      text-decoration: none;
      font-weight: bold;
    }

    footer a:hover { text-decoration: underline; }
  </style>
</head>

    let currentIndex = 0;

    function buildPills() {
      const bar = document.getElementById("pill-bar");
      bar.innerHTML = FUNNEL.map((item, idx) =>
        `<button class="pill" data-idx="${idx}" onclick="renderDispatch(${idx})">${item.label}</button>`
      ).join("");
    }

    function renderDispatch(idx) {
      if (idx < 0 || idx >= FUNNEL.length) return;
      currentIndex = idx;
      const d = FUNNEL[idx];

      document.getElementById("r-meta-left").textContent = `${d.id} // ${d.date}`;
      document.getElementById("r-meta-right").textContent = d.place;
      document.getElementById("r-title").textContent = d.title;
      document.getElementById("r-deck").textContent = d.deck;
      document.getElementById("r-counter").textContent = `${idx + 1} of ${FUNNEL.length}`;

      const bodyHtml = d.paragraphs.map((p, i) =>
        i === 0
          ? `<p>${p}</p><blockquote class="pull-quote">“${d.quote}”</blockquote>`
          : `<p>${p}</p>`
      ).join("");
      document.getElementById("r-body").innerHTML = bodyHtml;

      document.querySelectorAll(".pill").forEach((btn, i) => {
        btn.classList.toggle("active", i === idx);
      });

      history.replaceState(null, "", `#${d.id}`);
    }

    function stepDispatch(delta) {
      const next = (currentIndex + delta + FUNNEL.length) % FUNNEL.length;
      renderDispatch(next);
    }

    function filterDispatches() {
      const q = document.getElementById("search-input").value.trim().toLowerCase();
      let firstMatch = -1;

      document.querySelectorAll(".pill").forEach((btn, idx) => {
        const d = FUNNEL[idx];
        const haystack = `${d.id} ${d.label} ${d.date} ${d.place} ${d.title} ${d.deck} ${d.quote} ${d.paragraphs.join(" ")}`.toLowerCase();
        const match = !q || haystack.includes(q);
        btn.classList.toggle("hidden", !match);
        if (match && firstMatch === -1) firstMatch = idx;
      });

      if (q && firstMatch !== -1 && document.querySelectorAll(".pill")[currentIndex].classList.contains("hidden")) {
        renderDispatch(firstMatch);
      }
    }

    buildPills();
    const initialHash = window.location.hash.replace("#", "").toUpperCase();
    const startIdx = FUNNEL.findIndex(item => item.id === initialHash);
    renderDispatch(startIdx !== -1 ? startIdx : 0);
