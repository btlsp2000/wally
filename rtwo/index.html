<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="https://wallycad.com/gtfav.webp">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WALLYCAD // MERGED MASTER SHELL (RouteTwo • WallyCAD • CofP • Trailer)</title>
  <style>
    :root {
      --bg: #f8f5ee;
      --card: #fffdf9;
      --ink: #1a1917;
      --muted: #5a554c;
      --rule: #2b2925;
      --light-rule: #d6cfc2;
      --red: #9C2A20;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #eae4d7;
      color: var(--ink);
      font-family: "Georgia", serif;
      line-height: 1.62;
      padding: 12px 10px;
    }

    /* Calibrated for Fire HD 8 (601px Portrait / 962px Landscape) & Desktop */
    .container {
      max-width: 960px;
      margin: 0 auto;
      background: var(--bg);
      border: 2px solid var(--rule);
      padding: 18px 20px;
    }

    header {
      text-align: center;
      border-bottom: 3px double var(--rule);
      padding-bottom: 10px;
      margin-bottom: 14px;
    }

    header h1 {
      font-family: monospace;
      font-size: clamp(1.7rem, 4.5vw, 2.6rem);
      letter-spacing: 0.1em;
    }

    .subtitle {
      font-family: monospace;
      font-size: 0.8rem;
      color: var(--red);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-top: 2px;
    }

    /* 4-Pillar Domain Switcher */
    .domain-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--light-rule);
    }

    @media (max-width: 560px) {
      .domain-bar { grid-template-columns: repeat(2, 1fr); }
    }

    .dom-btn {
      background: var(--card);
      border: 1.5px solid var(--rule);
      color: var(--ink);
      font-family: monospace;
      font-weight: bold;
      font-size: 0.8rem;
      padding: 8px 6px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .dom-btn:hover { border-color: var(--red); color: var(--red); }
    .dom-btn.active { background: var(--rule); color: #fff; border-color: var(--rule); }

    /* =======================================================================
       CENTRAL CONTENT STAGE (DIRECTLY BELOW HEADER)
       ======================================================================= */
    .view-panel { display: none; }
    .view-panel.active { display: block; }

    .print-stamp { display: none; }

    .cross-links {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
      font-family: monospace;
      font-size: 0.76rem;
    }

    .xlink {
      background: var(--card);
      border: 1px solid var(--red);
      color: var(--red);
      padding: 3px 8px;
      cursor: pointer;
      font-family: monospace;
      font-weight: bold;
    }

    .xlink:hover { background: var(--red); color: #fff; }

    .reader-title {
      font-size: clamp(1.45rem, 3.2vw, 2.1rem);
      line-height: 1.2;
      margin-bottom: 8px;
    }

    .reader-deck {
      font-style: italic;
      color: var(--muted);
      border-bottom: 1px solid var(--light-rule);
      padding-bottom: 10px;
      margin-bottom: 14px;
    }

    /* 4-Tier Story Architecture Blocks */
    .story-tier {
      margin-bottom: 16px;
    }

    .story-tier + .story-tier {
      padding-top: 12px;
      border-top: 1px solid var(--light-rule);
    }

    .tier-label {
      font-family: monospace;
      font-size: 0.74rem;
      font-weight: bold;
      color: var(--red);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }

    .reader-body p { margin-bottom: 12px; }

    .pull-quote {
      border-left: 4px solid var(--red);
      padding-left: 14px;
      margin: 10px 0;
      font-style: italic;
      font-size: 1.08rem;
      color: var(--red);
    }

    .visual-frame {
      margin: 10px 0;
      background: var(--card);
      border: 1px solid var(--rule);
      padding: 8px;
    }

    .visual-caption {
      font-family: monospace;
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 5px;
    }

    .spec-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
      margin: 12px 0;
    }

    .spec-box {
      background: var(--card);
      border: 1px solid var(--rule);
      padding: 10px 12px;
      font-family: monospace;
      font-size: 0.8rem;
    }

    .spec-box strong {
      display: block;
      color: var(--red);
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px dashed var(--light-rule);
    }

    .tag-chip {
      background: var(--card);
      border: 1px solid var(--rule);
      font-family: monospace;
      font-size: 0.74rem;
      padding: 2px 8px;
      cursor: pointer;
    }

    .tag-chip:hover { border-color: var(--red); color: var(--red); }

    .seq-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 18px;
      padding-top: 12px;
      border-top: 1px solid var(--light-rule);
      font-family: monospace;
      font-size: 0.84rem;
    }

    .seq-btn {
      background: var(--card);
      border: 1px solid var(--rule);
      padding: 6px 12px;
      font-family: monospace;
      font-weight: bold;
      cursor: pointer;
    }

    .seq-btn:hover { background: var(--rule); color: #fff; }

    /* =======================================================================
       CONTROL DECK (BELOW CENTRAL STORY STAGE)
       ======================================================================= */
    .control-deck {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 3px double var(--rule);
    }

    .quad-compass {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      max-width: 560px;
      margin: 0 auto 12px auto;
      padding: 8px;
      border: 1.5px solid var(--rule);
      background: var(--card);
    }

    .quad-btn {
      background: var(--bg);
      border: 1.5px solid var(--rule);
      color: var(--ink);
      font-family: monospace;
      font-weight: bold;
      font-size: 0.82rem;
      padding: 8px 6px;
      cursor: pointer;
      text-transform: uppercase;
    }

    .quad-btn:hover { border-color: var(--red); color: var(--red); }
    .quad-btn.active { background: var(--red); border-color: var(--red); color: #fff; }

    .print-bar {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    .print-btn {
      background: var(--ink);
      color: #fff;
      border: 1.5px solid var(--ink);
      font-family: monospace;
      font-size: 0.78rem;
      font-weight: bold;
      padding: 6px 11px;
      cursor: pointer;
      text-transform: uppercase;
    }

    .print-btn.secondary { background: var(--card); color: var(--ink); }
    .print-btn:hover { background: var(--red); border-color: var(--red); color: #fff; }

    .funnel-controls {
      background: var(--card);
      border: 1px solid var(--rule);
      padding: 10px;
    }

    #search-input {
      width: 100%;
      padding: 8px 10px;
      font-family: monospace;
      font-size: 0.86rem;
      border: 1px solid var(--rule);
      background: var(--bg);
      color: var(--ink);
      margin-bottom: 8px;
    }

    .pill-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      font-family: monospace;
    }

    .pill {
      background: var(--bg);
      border: 1px solid var(--rule);
      color: var(--ink);
      font-family: monospace;
      font-size: 0.74rem;
      font-weight: bold;
      padding: 4px 8px;
      cursor: pointer;
    }

    .pill:hover { border-color: var(--red); color: var(--red); }
    .pill.active { background: var(--rule); border-color: var(--rule); color: #fff; }
    .pill.hidden { display: none; }

    /* Timeline, WIB & Index Views */
    .timeline-list { border-left: 3px solid var(--red); margin-left: 12px; padding-left: 18px; }
    .tl-item { position: relative; margin-bottom: 14px; padding: 10px 12px; background: var(--card); border: 1px solid var(--light-rule); cursor: pointer; }
    .tl-item:hover { border-color: var(--red); }
    .tl-item::before { content: ""; position: absolute; left: -25px; top: 14px; width: 10px; height: 10px; background: var(--red); border: 2px solid var(--bg); }
    .tl-year { font-family: monospace; font-size: 0.78rem; font-weight: bold; color: var(--red); text-transform: uppercase; }
    .tl-title { font-size: 1.08rem; font-weight: bold; margin: 2px 0; }
    .tl-sub { font-size: 0.88rem; color: var(--muted); }

    .wib-matrix { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
    .wib-card { background: var(--card); border: 1.5px solid var(--rule); padding: 12px; }
    .wib-card h3 { font-family: monospace; font-size: 0.85rem; color: var(--red); text-transform: uppercase; border-bottom: 1px solid var(--light-rule); padding-bottom: 5px; margin-bottom: 8px; }
    .wib-entry { padding: 5px 0; border-bottom: 1px dashed var(--light-rule); font-size: 0.88rem; cursor: pointer; }
    .wib-entry:last-child { border-bottom: none; }
    .wib-entry:hover { color: var(--red); }
    .wib-entry span { font-family: monospace; font-size: 0.74rem; font-weight: bold; color: var(--muted); display: block; }

    .index-grid { columns: 2 240px; column-gap: 20px; }
    .idx-group { break-inside: avoid; margin-bottom: 12px; background: var(--card); border: 1px solid var(--light-rule); padding: 9px 11px; }
    .idx-term { font-family: monospace; font-weight: bold; font-size: 0.86rem; margin-bottom: 4px; }
    .idx-refs { display: flex; flex-wrap: wrap; gap: 5px; }
    .idx-ref-btn { background: var(--bg); border: 1px solid var(--rule); font-family: monospace; font-size: 0.72rem; padding: 2px 6px; cursor: pointer; }
    .idx-ref-btn:hover { background: var(--red); border-color: var(--red); color: #fff; }

    /* Hidden Print Containers */
    #full-book-print,
    #mini-zine-output {
      display: none;
    }

    footer {
      margin-top: 20px;
      padding-top: 10px;
      border-top: 2px solid var(--rule);
      text-align: center;
      font-family: monospace;
      font-size: 0.76rem;
      color: var(--muted);
    }

    footer a { color: var(--red); text-decoration: none; font-weight: bold; }

    /* =========================================================================
       PRINT STYLESHEET (BROADSHEET, FULL BOOK, & 8-PAGE MINI-ZINE)
       ========================================================================= */
    @page { size: letter portrait; margin: 0.6in 0.65in; }

    @media print {
      body { background: #fff !important; color: #000 !important; padding: 0 !important; font-size: 10.5pt; line-height: 1.5; }
      .domain-bar, .control-deck, .cross-links, .seq-nav, footer a { display: none !important; }
      .container { max-width: 100% !important; border: none !important; padding: 0 !important; background: #fff !important; }
      header { border-bottom: 2px solid #000; padding-bottom: 6px; margin-bottom: 12px; }
      .subtitle, .tier-label { color: #000 !important; }
      .print-stamp {
        display: flex !important;
        justify-content: space-between;
        font-family: monospace;
        font-size: 8.5pt;
        font-weight: bold;
        border-bottom: 1px solid #000;
        padding-bottom: 4px;
        margin-bottom: 10px;
      }
      .pull-quote { border-left: 3px solid #000 !important; color: #000 !important; page-break-inside: avoid; }
      .visual-frame { border: 1px solid #000; page-break-inside: avoid; }

      body.print-all-mode #view-DISPATCH,
      body.print-all-mode #view-TIMELINE,
      body.print-all-mode #view-WIB,
      body.print-all-mode #view-INDEX { display: none !important; }
      body.print-all-mode #full-book-print { display: block !important; }
      .book-sheet { page-break-after: always; padding-top: 4px; }
      .book-sheet:last-child { page-break-after: auto; }

      body.zine-print-mode .container { display: none !important; }
      body.zine-print-mode #mini-zine-output {
        display: grid !important;
        width: 11in;
        height: 8.5in;
        grid-template-columns: repeat(4, 2.75in);
        grid-template-rows: repeat(2, 4.25in);
        position: relative;
        overflow: hidden;
      }
      .zine-panel {
        width: 2.75in;
        height: 4.25in;
        padding: 0.22in 0.2in;
        border: 0.4pt dotted #888;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        overflow: hidden;
        font-size: 7.5pt;
        line-height: 1.35;
        color: #000;
      }
      .zine-panel.invert { transform: rotate(180deg); }
      footer::after { content: "WallyCAD Unified Archive • RouteTwo • CofP • Space Trailer • Bill Tonnesen"; }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- MASTHEAD HEADER -->
    <header>
      <h1 id="mast-title">ROUTETWO</h1>
      <div class="subtitle" id="mast-sub">Merged Master Shell &bull; RouteTwo &bull; WallyCAD &bull; CofP &bull; Trailer</div>
    </header>

    <!-- 4-PILLAR DOMAIN SWITCHER -->
    <nav class="domain-bar" aria-label="Merged Pillars">
      <button class="dom-btn active" data-dom="ROUTETWO" onclick="switchDomain('ROUTETWO')">1. RouteTwo (/rtwo)</button>
      <button class="dom-btn" data-dom="WALLYCAD" onclick="switchDomain('WALLYCAD')">2. WallyCAD (/wally)</button>
      <button class="dom-btn" data-dom="COFP" onclick="switchDomain('COFP')">3. CofP (/billiards2)</button>
      <button class="dom-btn" data-dom="TRAILER" onclick="switchDomain('TRAILER')">4. Trailer (/cub)</button>
    </nav>

    <!-- =======================================================================
         CENTRAL CONTENT STAGE (DIRECTLY BELOW HEADER)
         4-PART ARCHITECTURE: 1. INTAKE | 2. INTERPRETATION | 3. BLURBS | 4. VISUALS
         ======================================================================= -->
    <main id="view-DISPATCH" class="view-panel active">
      <div class="print-stamp" id="p-stamp"></div>
      <div class="cross-links" id="r-xlinks"></div>
      <h2 class="reader-title" id="r-title"></h2>
      <p class="reader-deck" id="r-deck"></p>
      <div id="r-specs"></div>
      <div class="reader-body" id="r-body"></div>
      <div class="tag-row" id="r-tags"></div>

      <div class="seq-nav">
        <button class="seq-btn" onclick="stepDispatch(-1)">&laquo; Previous</button>
        <span id="r-counter"></span>
        <button class="seq-btn" onclick="stepDispatch(1)">Next &raquo;</button>
      </div>
    </main>

    <!-- TIMELINE VIEW -->
    <section id="view-TIMELINE" class="view-panel">
      <div class="timeline-list" id="timeline-container"></div>
    </section>

    <!-- WIB COORDINATES VIEW -->
    <section id="view-WIB" class="view-panel">
      <div class="wib-matrix" id="wib-container"></div>
    </section>

    <!-- MASTER INDEX VIEW -->
    <section id="view-INDEX" class="view-panel">
      <div class="index-grid" id="index-container"></div>
    </section>

    <!-- FULL ARCHIVE PRINT CONTAINER -->
    <section id="full-book-print" aria-hidden="true"></section>

    <!-- =======================================================================
         CONTROL DECK (4-QUADRANT COMPASS, PRINT BAR & UNIFIED SEARCH)
         ======================================================================= -->
    <div class="control-deck">
      <nav class="quad-compass" aria-label="4-Quadrant Matrix">
        <button class="quad-btn active" data-mode="DISPATCH" onclick="switchMode('DISPATCH')">&#9632; DISPATCH (Reader)</button>
        <button class="quad-btn" data-mode="TIMELINE" onclick="switchMode('TIMELINE')">&#9632; TIMELINE (Chronology)</button>
        <button class="quad-btn" data-mode="WIB" onclick="switchMode('WIB')">&#9632; WIB (Coordinates)</button>
        <button class="quad-btn" data-mode="INDEX" onclick="switchMode('INDEX')">&#9632; INDEX (Entities)</button>
      </nav>

      <div class="print-bar">
        <button class="print-btn" onclick="printSingleDispatch()">&#9113; Print Active Sheet</button>
        <button class="print-btn secondary" onclick="printFullArchive()">&#9113; Print Full Book</button>
        <button class="print-btn secondary" onclick="printEightPageZine()">&#9986; Print 8-Page Mini-Zine</button>
      </div>

      <section class="funnel-controls">
        <input type="text" id="search-input" placeholder="Search across RouteTwo, WallyCAD, CofP & Space Trailer..." oninput="filterAll()" />
        <div class="pill-bar" id="pill-bar"></div>
      </section>
    </div>

    <footer>
      <a href="/library">Golden Triangle &amp; Books</a> &bull;
      <a href="/wesley">/wesley</a> &bull;
      <a href="/armike">/armike</a> &bull;
      <a href="/transit">Transit / WIB</a> &bull;
      <a href="/photo-story">Photo Story</a>
    </footer>
  </div>

  <!-- 8-PAGE MINI-ZINE PRINT CONTAINER -->
  <section id="mini-zine-output" aria-hidden="true"></section>

  <script>
    /* =========================================================================
       UNIFIED MASTER FUNNEL (4-PART ARCHITECTURE PER BLOCK)
       1. intake (Complete) | 2. interpretation (Complete) | 3. blurbs | 4. visuals
       ========================================================================= */
    const FUNNEL = [
      /* --- PILLAR 1: ROUTETWO --- */

      const visualsHtml = (d.visuals || []).map(v => `
        <figure class="visual-frame">
          ${v.svg || (v.img ? `<img src="${v.img}" alt="${v.caption}" style="max-width:100%;display:block;"/>` : "")}
          <figcaption class="visual-caption">${v.caption}</figcaption>
        </figure>
      `).join("");

      return `
        <section class="story-tier">
          <div class="tier-label">01 // Intake Record (Complete)</div>
          ${intakeHtml}
        </section>

        ${interpHtml ? `
        <section class="story-tier">
          <div class="tier-label">02 // Interpretation (Complete)</div>
          ${interpHtml}
        </section>` : ""}

        ${blurbsHtml ? `
        <section class="story-tier">
          <div class="tier-label">03 // Blurb(s)</div>
          ${blurbsHtml}
        </section>` : ""}

        ${visualsHtml ? `
        <section class="story-tier">
          <div class="tier-label">04 // Visuals</div>
          ${visualsHtml}
        </section>` : ""}
      `;
    }

    function buildAllViews() {
      document.getElementById("pill-bar").innerHTML = FUNNEL.map((item, idx) =>
        `<button class="pill" data-idx="${idx}" data-dom="${item.domain}" onclick="jumpToDispatch(${idx})">${item.label}</button>`
      ).join("");

      const sorted = [...FUNNEL]
        .map((item, idx) => ({ ...item, origIdx: idx }))
        .sort((a, b) => a.sortYear - b.sortYear);

      document.getElementById("timeline-container").innerHTML = sorted.map(item => `
        <div class="tl-item searchable-card" data-idx="${item.origIdx}" onclick="jumpToDispatch(${item.origIdx})">
          <div class="tl-year">[${item.domain}] ${item.date} &bull; ${item.place} (${item.id})</div>
          <div class="tl-title">${item.title}</div>
          <div class="tl-sub">${item.deck}</div>
        </div>
      `).join("");

      const quads = [
        "Q4: Mojave & Las Vegas",
        "Q3: Southern California",
        "Q1: Pacific Northwest",
        "Q2: Sierra & Great Basin"
      ];
      document.getElementById("wib-container").innerHTML = quads.map(q => {
        const matches = FUNNEL.map((item, idx) => ({ ...item, origIdx: idx }))
          .filter(item => item.quadrant === q);
        return `
          <div class="wib-card">
            <h3>${q}</h3>
            ${matches.map(m => `
              <div class="wib-entry searchable-card" data-idx="${m.origIdx}" onclick="jumpToDispatch(${m.origIdx})">
                <span>[${m.domain}] ${m.id} // ${m.place}</span>
                ${m.title}
              </div>
            `).join("")}
          </div>
        `;
      }).join("");

      const termMap = {};
      FUNNEL.forEach((item, idx) => {
        (item.terms || []).forEach(term => {
          if (!termMap[term]) termMap[term] = [];
          termMap[term].push({ id: item.id, idx });
        });
      });

      const sortedTerms = Object.keys(termMap).sort((a, b) => a.localeCompare(b));
      document.getElementById("index-container").innerHTML = sortedTerms.map(term => `
        <div class="idx-group searchable-index" data-term="${term.toLowerCase()}">
          <div class="idx-term">${term}</div>
          <div class="idx-refs">
            ${termMap[term].map(ref =>
              `<button class="idx-ref-btn" onclick="jumpToDispatch(${ref.idx})">${ref.id}</button>`
            ).join("")}
          </div>
        </div>
      `).join("");

      document.getElementById("full-book-print").innerHTML = FUNNEL.map((d, i) => `
        <article class="book-sheet">
          <div class="print-stamp">
            <span>[${d.domain}] ${d.id} (${i + 1}/${FUNNEL.length}) &bull; ${d.date}</span>
            <span>${d.place} (${d.quadrant})</span>
          </div>
          <h2 class="reader-title">${d.title}</h2>
          <p class="reader-deck">${d.deck}</p>
          <div class="reader-body">${renderFourPartBody(d)}</div>
          <div class="tag-row">
            ${(d.terms || []).map(t => `<span class="tag-chip"># ${t}</span>`).join("")}
          </div>
        </article>
      `).join("");
    }

    function switchDomain(dom) {
      activeDomain = dom;
      document.querySelectorAll(".dom-btn").forEach(b => {
        b.classList.toggle("active", b.dataset.dom === dom);
      });
      document.getElementById("mast-title").textContent = DOMAIN_HEADERS[dom].title;
      document.getElementById("mast-sub").textContent = DOMAIN_HEADERS[dom].sub;

      const firstMatch = FUNNEL.findIndex(item => item.domain === dom);
      if (firstMatch !== -1) {
        renderDispatch(firstMatch);
        switchMode("DISPATCH");
      }
    }

    function switchMode(mode) {
      currentMode = mode;
      document.querySelectorAll(".quad-btn").forEach(b => {
        b.classList.toggle("active", b.dataset.mode === mode);
      });
      document.querySelectorAll(".view-panel").forEach(p => {
        p.classList.toggle("active", p.id === `view-${mode}`);
      });
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function jumpToDispatch(idx) {
      renderDispatch(idx);
      switchMode("DISPATCH");
    }

    function jumpToIndexTerm(term) {
      document.getElementById("search-input").value = term;
      filterAll();
      switchMode("INDEX");
    }

    function renderDispatch(idx) {
      if (idx < 0 || idx >= FUNNEL.length) return;
      currentIndex = idx;
      const d = FUNNEL[idx];

      activeDomain = d.domain;
      document.querySelectorAll(".dom-btn").forEach(b => {
        b.classList.toggle("active", b.dataset.dom === d.domain);
      });
      document.getElementById("mast-title").textContent = DOMAIN_HEADERS[d.domain].title;
      document.getElementById("mast-sub").textContent = DOMAIN_HEADERS[d.domain].sub;

      document.getElementById("p-stamp").innerHTML = `
        <span>[${d.domain}] ${d.id} &bull; ${d.date}</span>
        <span>${d.place} (${d.quadrant})</span>
      `;

      document.getElementById("r-xlinks").innerHTML = `
        <button class="xlink" onclick="switchMode('TIMELINE')">&#8599; TIMELINE: ${d.date}</button>
        <button class="xlink" onclick="switchMode('WIB')">&#8601; WIB: ${d.place}</button>
        <button class="xlink" onclick="switchMode('INDEX')">&#8600; INDEX (${(d.terms||[]).length})</button>
      `;

      document.getElementById("r-title").textContent = d.title;
      document.getElementById("r-deck").textContent = d.deck;
      document.getElementById("r-counter").textContent = `[${d.domain}] ${d.id} (${idx + 1} of ${FUNNEL.length})`;

      document.getElementById("r-specs").innerHTML = d.specs
        ? `<div class="spec-grid">${d.specs.map(s => `<div class="spec-box"><strong>${s.k}</strong>${s.v}</div>`).join("")}</div>`
        : "";

      document.getElementById("r-body").innerHTML = renderFourPartBody(d);

      document.getElementById("r-tags").innerHTML = (d.terms || []).map(t =>
        `<button class="tag-chip" onclick="jumpToIndexTerm('${t.replace(/'/g, "\\'")}')"># ${t}</button>`
      ).join("");

      document.querySelectorAll(".pill").forEach((btn, i) => {
        btn.classList.toggle("active", i === idx);
      });

      history.replaceState(null, "", `#${d.id}`);
    }

    function stepDispatch(delta) {
      renderDispatch((currentIndex + delta + FUNNEL.length) % FUNNEL.length);
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function printSingleDispatch() {
      document.body.classList.remove("print-all-mode", "zine-print-mode");
      if (currentMode !== "DISPATCH") switchMode("DISPATCH");
      window.print();
    }

    function printFullArchive() {
      document.body.classList.remove("zine-print-mode");
      document.body.classList.add("print-all-mode");
      window.print();
      setTimeout(() => document.body.classList.remove("print-all-mode"), 500);
    }

    function printEightPageZine() {
      const pick = offset => FUNNEL[(currentIndex + offset) % FUNNEL.length];
      const [p2, p3, p4, p5, p6, p7] = [pick(1), pick(2), pick(3), pick(4), pick(5), pick(6)];
      const cover = pick(0);

      const renderPanel = (item, pageNum, invert) => {
        const blurb = (item.blurbs && item.blurbs[0]) ? item.blurbs[0] : "";
        return `
          <article class="zine-panel ${invert ? 'invert' : ''}">
            <div>
              <div style="font-family:monospace;font-size:6.8pt;font-weight:bold;border-bottom:1px solid #000;padding-bottom:2px;margin-bottom:5px;display:flex;justify-content:space-between;">
                <span>${item.id}</span><span>${item.date}</span>
              </div>
              <h3 style="font-size:10.5pt;line-height:1.15;margin-bottom:5px;">${item.title}</h3>
              <p style="margin-bottom:5px;">${item.deck}</p>
              ${blurb ? `<blockquote style="border-left:2px solid #000;padding-left:5px;font-style:italic;font-size:7.2pt;">“${blurb}”</blockquote>` : ""}
            </div>
            <div style="font-family:monospace;font-size:6.4pt;border-top:0.5pt solid #888;padding-top:2px;display:flex;justify-content:space-between;">
              <span>${item.place}</span><span>P. ${pageNum}</span>
            </div>
          </article>
        `;
      };

      const zineRoot = document.getElementById("mini-zine-output");
      zineRoot.innerHTML = `
        <div style="position:absolute;top:4.25in;left:2.75in;width:5.5in;border-top:1.5pt solid #000;z-index:10;"></div>
        ${renderPanel(p5, 5, true)}
        ${renderPanel(p4, 4, true)}
        ${renderPanel(p3, 3, true)}
        ${renderPanel(p2, 2, true)}
        ${renderPanel(p6, 6, false)}
        ${renderPanel(p7, 7, false)}
        <article class="zine-panel">
          <div>
            <div style="font-family:monospace;font-size:6.8pt;font-weight:bold;border-bottom:1px solid #000;padding-bottom:2px;margin-bottom:5px;">BACK COVER // 4-PILLAR MATRIX</div>
            <h3 style="font-size:10.5pt;margin-bottom:6px;">WallyCAD Unified Shell</h3>
            <p style="margin-bottom:6px;"><strong>1. RouteTwo:</strong> Running Life Survey<br/><strong>2. WallyCAD:</strong> 2D Vector Engine<br/><strong>3. CofP:</strong> Calculus of Pool<br/><strong>4. Trailer:</strong> 5'×8' The Cub</p>
            <p>Single-source archival shell feeding Reader, Timeline, WIB &amp; Master Index.</p>
          </div>
          <div style="font-family:monospace;font-size:6.5pt;border-top:0.5pt solid #888;padding-top:2px;">wallycad.com/rtwo</div>
        </article>
        <article class="zine-panel" style="border:1.5pt solid #000;text-align:center;">
          <div>
            <div style="font-family:monospace;font-size:6.8pt;letter-spacing:0.1em;">THE NEW FAMILY TIMES &bull; FIELD ZINE</div>
            <div style="font-family:monospace;font-size:18pt;font-weight:bold;letter-spacing:0.1em;border-top:2px solid #000;border-bottom:2px solid #000;padding:5px 0;margin:6px 0;">${DOMAIN_HEADERS[cover.domain].title}</div>
            <h2 style="font-size:12pt;line-height:1.2;margin:8px 0;">${cover.title}</h2>
            <p style="font-style:italic;font-size:7.3pt;">${cover.deck}</p>
          </div>
          <div style="font-family:monospace;font-size:6.5pt;border-top:1px solid #000;padding-top:3px;">Bill Tonnesen &bull; LKA Archive</div>
        </article>
      `;

      document.body.classList.remove("print-all-mode");
      document.body.classList.add("zine-print-mode");
      window.print();
      setTimeout(() => document.body.classList.remove("zine-print-mode"), 500);
    }

    function filterAll() {
      const q = document.getElementById("search-input").value.trim().toLowerCase();
      FUNNEL.forEach((d, idx) => {
        const hay = `${d.domain} ${d.id} ${d.label} ${d.date} ${d.place} ${d.quadrant} ${(d.terms||[]).join(" ")} ${d.title} ${d.deck} ${(d.blurbs||[]).join(" ")} ${(d.intake||[]).join(" ")} ${(d.interpretation||[]).join(" ")}`.toLowerCase();
        const match = !q || hay.includes(q);
        document.querySelector(`.pill[data-idx="${idx}"]`).classList.toggle("hidden", !match);
        document.querySelectorAll(`.searchable-card[data-idx="${idx}"]`).forEach(el => {
          el.style.display = match ? "" : "none";
        });
      });

      document.querySelectorAll(".searchable-index").forEach(el => {
        el.style.display = (!q || el.dataset.term.includes(q)) ? "" : "none";
      });
    }

    buildAllViews();
    const rawHash = window.location.hash.replace("#", "").toUpperCase();
    if (["TIMELINE", "WIB", "INDEX"].includes(rawHash)) {
      renderDispatch(0);
      switchMode(rawHash);
    } else {
      const found = FUNNEL.findIndex(item => item.id === rawHash);
      renderDispatch(found !== -1 ? found : 0);
    }
  </script>
</body>
</html>
