<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WallyCAD | Parabola Generator Standalone</title>
    <style>
        body { 
            background: #1a1a1a; 
            color: #00ff00; 
            font-family: 'Consolas', 'Courier New', monospace; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            margin: 0;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container { 
            display: flex; 
            gap: 20px; 
            flex-wrap: wrap; 
            justify-content: center; 
            max-width: 1000px; 
            width: 100%; 
            flex-grow: 1;
        }
        .panel { 
            background: #000; 
            border: 1px solid #444; 
            padding: 20px; 
            width: 340px; 
            box-sizing: border-box; 
            display: flex; 
            flex-direction: column; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .row { 
            display: flex; 
            justify-content: space-between; 
            margin-bottom: 12px; 
            align-items: center; 
            font-size: 12px;
        }
        input, select { 
            background: #111; 
            border: 1px solid #444; 
            color: #00ff00; 
            padding: 6px; 
            width: 90px; 
            font-family: inherit; 
            text-align: right; 
        }
        input:focus, select:focus {
            outline: 1px solid #00ff00;
        }
        textarea { 
            width: 100%; 
            background: #111; 
            color: #00ff00; 
            border: 1px solid #444; 
            padding: 10px; 
            margin-bottom: 10px; 
            box-sizing: border-box; 
            font-size: 11px; 
            resize: vertical; 
        }
        button { 
            background: #00ff00; 
            color: #000; 
            border: none; 
            padding: 12px; 
            cursor: pointer; 
            font-weight: bold; 
            width: 100%; 
            margin-top: 10px; 
            font-family: inherit;
            transition: 0.2s;
        }
        button:hover { 
            background: #00cc00; 
        }
        canvas { 
            background: #121212; 
            border: 1px solid #444; 
            flex-grow: 1; 
            min-width: 400px; 
            min-height: 400px; 
        }
        h2 { 
            margin-top: 0; 
            color: #fff; 
            text-align: center; 
            font-size: 16px; 
            border-bottom: 1px solid #444; 
            padding-bottom: 10px; 
            letter-spacing: 1px;
        }
        .label { 
            font-size: 10px; 
            color: #aaa; 
            margin-bottom: 4px; 
            display: block; 
            text-transform: uppercase; 
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="panel">
            <h2>WALLY PARABOLA ENGINE</h2>
            
            <div class="row" style="margin-top: 10px;">
                <span title="Total width from start to end on the X-axis">Span Width (W):</span>
                <input type="number" id="pSpan" value="120" step="1" oninput="generate()">
            </div>
            <div class="row">
                <span title="Maximum height of the curve on the Y-axis">Apex Height (H):</span>
                <input type="number" id="pApex" value="48" step="1" oninput="generate()">
            </div>
            <div class="row">
                <span title="Number of straight line segments making up the curve">Resolution (Segs):</span>
                <input type="number" id="pRes" value="36" step="1" min="2" max="360" oninput="generate()">
            </div>
            <div class="row">
                <span title="Orientation of the curve">Polarity:</span>
                <select id="pFlip" onchange="generate()">
                    <option value="UP">Arch (Up)</option>
                    <option value="DOWN">Sag (Down)</option>
                </select>
            </div>

            <button onclick="copyToClipboard()" id="copyBtn">COPY FLATTENED SDJ</button>
            
            <span class="label" style="margin-top: 20px;">OUTPUT (1D STRING):</span>
            <textarea id="outputSdj" rows="8" readonly placeholder="SDJ String will appear here..."></textarea>
            
            <div style="font-size: 9px; color: #666; text-align: center; margin-top: auto;">
                SYS.MODULE // /PARABOLA
            </div>
        </div>
        
        <canvas id="preview"></canvas>
    </div>

    <script>
        function generate() {
            const span = parseFloat(document.getElementById('pSpan').value) || 120;
            const apex = parseFloat(document.getElementById('pApex').value) || 48;
            const res = parseInt(document.getElementById('pRes').value) || 36;
            const flip = document.getElementById('pFlip').value === 'DOWN';
            
            if (res < 2) return;

            const pts = [];
            // Vertex form equation: y = a(x - h)^2 + k
            // Baseline from 0 to Span. Apex at (Span/2, Apex).
            // 0 = a(0 - Span/2)^2 + Apex  =>  a = -4 * Apex / (Span^2)
            const a = (-4 * apex) / (span * span);

            for (let i = 0; i <= res; i++) {
                const x = (i / res) * span;
                let y = a * Math.pow(x - span / 2, 2) + apex;
                
                if (flip) y = -y;
                
                pts.push({ x: parseFloat(x.toFixed(4)), y: parseFloat(y.toFixed(4)) });
            }

            // Generate 1D SDJ String
            let sdjArray = [];
            for (let i = 0; i < pts.length - 1; i++) {
                const p1 = pts[i];
                const p2 = pts[i+1];
                sdjArray.push(`[LINE] ${p1.x} ${p1.y} ${p2.x} ${p2.y} T:0`);
            }
            
            const finalString = sdjArray.join(" ");
            document.getElementById('outputSdj').value = finalString;

            drawPreview(pts, span, apex, flip);
        }

        function drawPreview(pts, span, apex, flip) {
            const cvs = document.getElementById('preview');
            // Responsive sizing
            cvs.width = cvs.parentElement.clientWidth - 380; 
            cvs.height = cvs.parentElement.clientHeight;
            const ctx = cvs.getContext('2d');
            
            ctx.clearRect(0, 0, cvs.width, cvs.height);

            // Auto-scale logic
            const pad = 60;
            const minX = 0;
            const maxX = span;
            const minY = flip ? -apex : 0;
            const maxY = flip ? 0 : apex;
            
            const w = maxX - minX || 1;
            const h = maxY - minY || 1;
            
            const scaleX = (cvs.width - pad * 2) / w;
            const scaleY = (cvs.height - pad * 2) / h;
            const scale = Math.min(scaleX, scaleY);
            
            const cx = (minX + maxX) / 2;
            const cy = (minY + maxY) / 2;

            ctx.save();
            ctx.translate(cvs.width / 2, cvs.height / 2);
            ctx.scale(scale, -scale); // Flip Y to match Cartesian
            ctx.translate(-cx, -cy);

            // Draw Baseline/Axis
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 1 / scale;
            ctx.beginPath();
            ctx.moveTo(-span*0.1, 0);
            ctx.lineTo(span*1.1, 0);
            ctx.moveTo(span/2, minY - Math.abs(apex)*0.1);
            ctx.lineTo(span/2, maxY + Math.abs(apex)*0.1);
            ctx.stroke();

            // Draw Parabola
            ctx.strokeStyle = '#00ffff';
            ctx.lineWidth = 2 / scale;
            ctx.beginPath();
            pts.forEach((p, i) => {
                if (i === 0) ctx.moveTo(p.x, p.y);
                else ctx.lineTo(p.x, p.y);
            });
            ctx.stroke();

            // Draw Nodes
            ctx.fillStyle = '#00ff00';
            pts.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3 / scale, 0, Math.PI * 2);
                ctx.fill();
            });

            ctx.restore();
        }

        function copyToClipboard() {
            const output = document.getElementById('outputSdj').value;
            navigator.clipboard.writeText(output).then(() => {
                const btn = document.getElementById('copyBtn');
                const originalText = btn.innerText;
                btn.innerText = "COPIED TO CLIPBOARD!";
                btn.style.background = "#fff";
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.background = "#00ff00";
                }, 1500);
            });
        }

        // Handle window resize for canvas
        window.addEventListener('resize', generate);
        
        // Run on load
        window.onload = generate;
    </script>
</body>
</html>
