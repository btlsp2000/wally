<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traverse Engine - Logic Diagram Panel</title>
    <style>
        :root {
            --line-color: #000;
            --font-stack: 'Consolas', 'Courier New', monospace;
            /* Traverse UI Colors */
            --bg-canvas: #000000;
            --traverse-neon: #00ff00;
            --traverse-origin: #ff0000;
            --traverse-muted: #555555;
            --grid: #111111;
        }
        body {
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4; /* Off-white for screen viewing */
            font-family: var(--font-stack);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
        }
        /* Sized exactly to 1 panel of the 4-quadrant layout */
        .quadrant {
            width: 5.5in;
            height: 4.25in;
            background-color: white;
            border: 1px solid var(--line-color);
            box-sizing: border-box;
            padding: 0.35in;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .card-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .card-version-label {
            font-size: 10px;
            font-weight: bold;
            letter-spacing: 1px;
            color: #333;
        }
        .card-note-label {
            font-size: 9px;
            font-weight: bold;
            letter-spacing: 0.5px;
            color: #555;
        }
        .image-container {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            width: 100%;
            overflow: hidden;
            background: var(--bg-canvas);
            border: 2px solid var(--line-color);
            border-radius: 4px;
            padding: 10px;
            position: relative;
            box-shadow: inset 0 0 15px rgba(0,255,0,0.1);
            box-sizing: border-box;
        }
        .image-container svg {
            max-width: 100%;
            max-height: 100%;
        }
        
        @media print {
            body { 
                background: white; 
                padding: 0; 
                display: block; 
            }
            .quadrant { 
                box-shadow: none; 
                margin: 0; 
            }
        }
    </style>
</head>
<body>

    <div class="quadrant">
        <!-- Header Row -->
        <div class="card-header-row">
            <span class="card-version-label">VER: traverse-v1 [2026.10.14]</span>
            <span class="card-note-label">[ RELATIVE-TO-ABSOLUTE ]</span>
        </div>
        
        <!-- Illustration Content -->
        <div style="font-size: 12px; font-weight: bold; margin-bottom: 5px; text-align: center;">TRAVERSE LOGIC & DEFLECTION VECTORS</div>
        <div class="image-container">
            <svg viewBox="0 0 350 160" xmlns="http://www.w3.org/2000/svg">
                <!-- Grid Lines -->
                <g stroke="var(--grid)" stroke-width="1">
                    <line x1="0" y1="40" x2="350" y2="40" />
                    <line x1="0" y1="80" x2="350" y2="80" />
                    <line x1="0" y1="120" x2="350" y2="120" />
                    <line x1="50" y1="0" x2="50" y2="160" />
                    <line x1="130" y1="0" x2="130" y2="160" />
                    <line x1="210" y1="0" x2="210" y2="160" />
                    <line x1="290" y1="0" x2="290" y2="160" />
                </g>

                <!-- Traverse Path Lines -->
                <polyline points="50,120 130,120 130,40 210,40 270,100" fill="none" stroke="var(--traverse-neon)" stroke-width="2" stroke-linejoin="miter"/>
                
                <!-- Projection Dash -->
                <line x1="210" y1="40" x2="240" y2="40" stroke="var(--traverse-muted)" stroke-dasharray="3,3" stroke-width="1.5"/>
                <path d="M 230,40 A 20,20 0 0,1 224,54" fill="none" stroke="var(--traverse-neon)" stroke-width="1"/>

                <!-- Nodes -->
                <!-- Start Point P0 (Red) -->
                <rect x="47" y="117" width="6" height="6" fill="var(--traverse-origin)" />
                <!-- P1 to P4 (Green) -->
                <rect x="128" y="118" width="4" height="4" fill="var(--traverse-neon)" />
                <rect x="128" y="38" width="4" height="4" fill="var(--traverse-neon)" />
                <rect x="208" y="38" width="4" height="4" fill="var(--traverse-neon)" />
                <rect x="268" y="98" width="4" height="4" fill="var(--traverse-neon)" />

                <!-- Annotations -->
                <text x="80" y="115" fill="var(--traverse-neon)" font-family="monospace" font-size="9">L 80</text>
                <text x="135" y="80" fill="var(--traverse-neon)" font-family="monospace" font-size="9">L 80</text>
                <text x="160" y="35" fill="var(--traverse-neon)" font-family="monospace" font-size="9">R 80</text>
                <text x="245" y="70" fill="var(--traverse-neon)" font-family="monospace" font-size="9">T 85, 45</text>
                
                <text x="10" y="20" fill="var(--traverse-muted)" font-family="monospace" font-size="10">Heading: 45° | P-Points: 5</text>
            </svg>
        </div>
        <div style="font-size: 9px; text-align: center; margin-top: 5px; color: #555;">RED: Origin P0 | GREEN: Computed Trajectory Vectors</div>
    </div>

</body>
</html>
