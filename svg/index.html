<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WallyCAD Engine Replica SVG</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f0f0f0; /* Light background to contrast with the dark UI */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        svg {
            /* Adjust max-width/height to scale nicely while preserving aspect ratio */
            max-width: 90vw;
            max-height: 90vh;
            /* Optional: add a subtle drop shadow */
            filter: drop-shadow(0px 4px 10px rgba(0,0,0,0.2));
            /* Ensure the SVG scales smoothly */
            width: 100%;
            height: auto;
        }
    </style>
</head>
<body>

    <!-- The exact SVG you provided -->
    <svg viewBox="0 0 480 320" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <style>
                .ui-bg { fill: #161b22; }
                .ui-panel { fill: #1e293b; }
                .ui-canvas { fill: #070a0e; }
                .ui-text { fill: #38bdf8; font-family: monospace; font-size: 8px; font-weight: bold; }
                .ui-muted { fill: #94a3b8; font-family: monospace; font-size: 7px; }
                .ui-btn { fill: #334155; rx: 2px; }
                .ui-geo { fill: none; stroke: #3fb950; stroke-width: 1.5; stroke-linejoin: bevel; }
                .ui-axis { fill: none; stroke: #334155; stroke-width: 1; }
                .call-box { fill: #fff; stroke: #ef4444; stroke-width: 1.5; }
                .call-text { fill: #ef4444; font-family: sans-serif; font-size: 9px; font-weight: bold; }
                .call-sub { fill: #111; font-family: sans-serif; font-size: 8px; }
                .call-line { fill: none; stroke: #ef4444; stroke-width: 1.5; }
            </style>
        </defs>
        
        <!-- Main UI Container -->
        <g transform="translate(40, 50)">
            <rect width="360" height="220" class="ui-bg" stroke="#333" stroke-width="2"/>
            
            <!-- Top Toolbar -->
            <rect width="360" height="20" class="ui-panel" />
            <text x="10" y="14" class="ui-text" style="font-size:10px;">≡ WALLY v1.0.144</text>
            <rect x="100" y="4" width="25" height="12" class="ui-btn"/><text x="104" y="12" class="ui-text">NEW</text>
            <rect x="130" y="4" width="25" height="12" class="ui-btn"/><text x="132" y="12" class="ui-text">SAVE</text>
            
            <!-- Highlighted Tool Group -->
            <rect x="160" y="3" width="135" height="14" fill="none" stroke="#ef4444" stroke-width="1.5" />
            <rect x="162" y="4" width="25" height="12" class="ui-btn"/><text x="165" y="12" class="ui-text">LINE</text>
            <rect x="192" y="4" width="25" height="12" class="ui-btn" style="fill:#38bdf8;"/><text x="195" y="12" class="ui-text" style="fill:#000;">WALL</text>
            <rect x="222" y="4" width="35" height="12" class="ui-btn"/><text x="225" y="12" class="ui-text">CIRCLE</text>
            <rect x="262" y="4" width="30" height="12" class="ui-btn"/><text x="266" y="12" class="ui-text">STAIR</text>
            
            <!-- Left Sidebar -->
            <rect y="20" width="90" height="180" class="ui-bg" />
            <text x="5" y="35" class="ui-muted" style="letter-spacing:1px;">IRON PROTOCOL</text>
            <rect x="5" y="40" width="38" height="12" class="ui-btn"/><text x="8" y="48" class="ui-text" style="font-size:5px;">EXP WALLY</text>
            <rect x="47" y="40" width="38" height="12" class="ui-btn"/><text x="50" y="48" class="ui-text" style="font-size:5px;">IMP WALLY</text>
            
            <text x="5" y="65" class="ui-text">PROPERTIES</text>
            <rect x="5" y="70" width="80" height="70" class="ui-canvas" stroke="#334155" />
            <text x="8" y="80" class="ui-text" style="fill:#fbbf24;">TYPE: WALL</text>
            <text x="8" y="90" class="ui-muted">0,0</text>
            <text x="8" y="98" class="ui-muted">120,0</text>
            <text x="8" y="106" class="ui-muted">120,96</text>
            <text x="8" y="114" class="ui-muted">0,96</text>
            <text x="8" y="122" class="ui-muted">0,0</text>
            
            <text x="5" y="155" class="ui-text">ENTITIES</text>
            <rect x="5" y="160" width="80" height="15" class="ui-panel" />
            <text x="8" y="170" class="ui-text" style="fill:#3fb950;">WALL [5]</text>
            
            <!-- Main Canvas -->
            <rect x="90" y="20" width="270" height="180" class="ui-canvas" />
            <line x1="100" y1="160" x2="350" y2="160" class="ui-axis" />
            <line x1="130" y1="30" x2="130" y2="190" class="ui-axis" />
            
            <!-- The House Drawing -->
            <g transform="translate(130, 80)">
                <!-- Base Box -->
                <rect x="0" y="0" width="140" height="80" class="ui-geo" />
                <polyline points="0,0 70,-40 140,0" class="ui-geo" />
                <line x1="-10" y1="80" x2="150" y2="80" class="ui-geo" />
                <!-- Windows -->
                <rect x="20" y="15" width="25" height="25" class="ui-geo" />
                <rect x="55" y="15" width="25" height="25" class="ui-geo" />
                <rect x="20" y="45" width="25" height="25" class="ui-geo" />
                <rect x="55" y="45" width="25" height="25" class="ui-geo" />
                
                <rect x="95" y="15" width="25" height="25" class="ui-geo" />
                <rect x="95" y="45" width="25" height="25" class="ui-geo" />
            </g>
            
            <!-- Bottom CLI -->
            <rect x="90" y="200" width="270" height="20" class="ui-panel" stroke="#3fb950" stroke-width="1"/>
            <text x="95" y="213" class="ui-text" style="fill:#fbbf24;">COMMAND > _</text>
            <text x="290" y="213" class="ui-muted">X:120 Y:96</text>
        </g>
        
        <!-- Callout: Toolbar -->
        <rect x="60" y="5" width="165" height="30" class="call-box" />
        <text x="65" y="18" class="call-text">TOOLBAR: Main command</text>
        <text x="65" y="28" class="call-sub">activation buttons.</text>
        <path d="M 140,35 L 140,45 L 250,45 L 250,52" class="call-line" />
        
        <!-- Callout: Sidebar -->
        <rect x="10" y="280" width="150" height="30" class="call-box" />
        <text x="15" y="293" class="call-text">SIDEBAR: Contains ENTITIES</text>
        <text x="15" y="303" class="call-sub">list &amp; PROPERTIES panel.</text>
        <path d="M 85,280 L 85,260 L 70,260 L 70,230" class="call-line" />
        
        <!-- Callout: CLI -->
        <rect x="260" y="280" width="165" height="30" class="call-box" />
        <text x="265" y="293" class="call-text">CLI: Command Line Input</text>
        <text x="265" y="303" class="call-sub">for text-based commands.</text>
        <path d="M 340,280 L 340,270" class="call-line" />
        
        <!-- Callout: Canvas -->
        <rect x="330" y="100" width="140" height="30" class="call-box" />
        <text x="335" y="113" class="call-text">CANVAS WORKSPACE:</text>
        <text x="335" y="123" class="call-sub">Main area for drafting.</text>
        <path d="M 330,115 L 310,115 L 310,140" class="call-line" />
        
    </svg>

</body>
</html>
