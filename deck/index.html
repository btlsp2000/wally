<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WallyCAD - Deck Module</title>
    <style>
        body { font-family: monospace; padding: 20px; display: flex; gap: 20px; user-select: none; }
        .panel { display: flex; flex-direction: column; width: 300px; }
        .input-group { margin-bottom: 10px; display: flex; justify-content: space-between; }
        input { width: 80px; text-align: right; }
        button { padding: 10px; margin-top: 10px; cursor: pointer; font-weight: bold; }
        
        .main-content { display: flex; flex-direction: column; gap: 15px; }
        
        /* Canvas Styling */
        canvas { 
            border: 1px solid #333; 
            background-color: #f4f4f4; 
            width: 800px; 
            height: 400px; 
            cursor: grab;
        }
        canvas:active { cursor: grabbing; }
        .toolbar { display: flex; gap: 10px; align-items: center; }
        
        /* Readout Panel Styling */
        textarea {
            width: 800px;
            height: 200px;
            font-family: monospace;
            font-size: 12px;
            background-color: #1e1e1e;
            color: #d4d4d4;
            padding: 10px;
            border: 1px solid #333;
            resize: vertical;
        }
        h4 { margin: 0; padding-top: 10px; }
    </style>
</head>
<body>

    <div class="panel">
        <h3>DECK PARAMETERS</h3>
        <div class="input-group"><label>Deck Length (X)</label><input type="number" id="deckLen" value="144" oninput="triggerRedraw()"></div>
        <div class="input-group"><label>Post Spacing</label><input type="number" id="postSpace" value="48" oninput="triggerRedraw()"></div>
        <div class="input-group"><label>Joist Spacing</label><input type="number" id="joistSpace" value="16" oninput="triggerRedraw()"></div>
        <div class="input-group"><label>Joist Depth</label><input type="number" id="joistDepth" value="8" oninput="triggerRedraw()"></div>

        <h3>GRADE ELEVATION</h3>
        <div class="input-group"><label>Start Drop (X=0)</label><input type="number" id="dropStart" value="12" oninput="triggerRedraw()"></div>
        <div class="input-group"><label>End Drop</label><input type="number" id="dropEnd" value="36" oninput="triggerRedraw()"></div>

        <h3>STAIRS & FOOTINGS</h3>
        <div class="input-group"><label>Tread Run</label><input type="number" id="tread" value="11" oninput="triggerRedraw()"></div>
        <div class="input-group"><label>Riser Height</label><input type="number" id="riser" value="7" oninput="triggerRedraw()"></div>
        <div class="input-group"><label>Footing Depth</label><input type="number" id="footDepth" value="24" oninput="triggerRedraw()"></div>

        <button onclick="downloadLisp()">EXPORT .TXT</button>
    </div>

    <div class="main-content">
        <div class="toolbar">
            <button onclick="zoomExtents()">ZOOM EXTENTS</button>
            <span style="color: #555;">(Scroll to Zoom, Click & Drag to Pan)</span>
        </div>
        
        <canvas id="deckCanvas" width="800" height="400"></canvas>
        
        <h4>LIVE COORDINATE PAYLOAD</h4>
        <textarea id="lispReadout" readonly></textarea>
    </div>

    <script>
        const canvas = document.getElementById('deckCanvas');
        const ctx = canvas.getContext('2d');
        const readout = document.getElementById('lispReadout');

        // Global Viewport Variables
        let viewOffsetX = 50;
        let viewOffsetY = 150;
        let viewScale = 4;
        
        let isDragging = false;
        let dragStartX = 0;
        let dragStartY = 0;

        function mapToCanvas(x, y) {
            return {
                cx: viewOffsetX + (x * viewScale),
                cy: viewOffsetY + (y * viewScale) 
            };
        }

        // Mouse Events for Pan/Zoom
        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            dragStartX = e.offsetX - viewOffsetX;
            dragStartY = e.offsetY - viewOffsetY;
        });
        canvas.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            viewOffsetX = e.offsetX - dragStartX;
            viewOffsetY = e.offsetY - dragStartY;
            drawPreview(); 
        });
        canvas.addEventListener('mouseup', () => { isDragging = false; });
        canvas.addEventListener('mouseleave', () => { isDragging = false; });
        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const factor = 1 + ((e.deltaY > 0 ? -1 : 1) * 0.1);
            viewOffsetX = e.offsetX - (e.offsetX - viewOffsetX) * factor;
            viewOffsetY = e.offsetY - (e.offsetY - viewOffsetY) * factor;
            viewScale *= factor;
            drawPreview();
        });

        function zoomExtents() {
            const len = parseFloat(document.getElementById('deckLen').value) || 144;
            const drop1 = parseFloat(document.getElementById('dropStart').value) || 0;
            const drop2 = parseFloat(document.getElementById('dropEnd').value) || 0;
            const tread = parseFloat(document.getElementById('tread').value) || 11;
            const riser = parseFloat(document.getElementById('riser').value) || 7;
            const footDepth = parseFloat(document.getElementById('footDepth').value) || 24;
            
            const m = (drop2 - drop1) / len; 
            const b = drop1;
            const m_stair = riser / tread;
            
            let currentX = len;
            let currentY = 0;
            let hitGround = false;
            let stepCount = 0;
            
            if (m >= m_stair) hitGround = true; 

            while (!hitGround && stepCount < 100) {
                stepCount++;
                let nextX = currentX + tread;
                let nextY = currentY + riser;
                if (nextY < (m * nextX) + b) {
                    currentX = nextX;
                    currentY = nextY;
                } else {
                    hitGround = true;
                    currentX = (b - (currentY - (m_stair * currentX))) / (m_stair - m);
                }
            }

            const boundingWidth = currentX + 32; 
            const maxFootingDrop = Math.max((m * len) + b + footDepth + 8, drop1 + footDepth + 20);
            const boundingHeight = maxFootingDrop + 36; 

            viewScale = Math.min(canvas.width / boundingWidth, canvas.height / boundingHeight) * 0.85;
            viewOffsetX = (canvas.width - (currentX * viewScale)) / 2;
            viewOffsetY = (36 * viewScale) + 50; 

            drawPreview();
        }

        function triggerRedraw() {
            drawPreview();
            updateReadout();
        }

        // Shared Logic for Canvas and LISP
        function calculateGeometry() {
            const len = parseFloat(document.getElementById('deckLen').value) || 144;
            const spacing = parseFloat(document.getElementById('postSpace').value) || 48;
            const joistSpacing = parseFloat(document.getElementById('joistSpace').value) || 16;
            const joistDepth = parseFloat(document.getElementById('joistDepth').value) || 8;
            const drop1 = parseFloat(document.getElementById('dropStart').value) || 0;
            const drop2 = parseFloat(document.getElementById('dropEnd').value) || 0;
            const tread = parseFloat(document.getElementById('tread').value) || 11;
            const riser = parseFloat(document.getElementById('riser').value) || 7;
            const footDepth = parseFloat(document.getElementById('footDepth').value) || 24;
            
            const railHeight = 36; 
            const railCap = 1.5;   
            const subFootOverride = footDepth + 12;
            const m = (drop2 - drop1) / len; 
            const b = drop1; 

            let geo = {
                deck: [[0, 0], [len, 0]],
                rail: [[0, -railHeight], [len, -railHeight]],
                railCapBot: [[0, -(railHeight - railCap)], [len, -(railHeight - railCap)]],
                joists: [],
                posts: [],
                footings: [],
                grade: [[-20, (m * -20) + b], [len + 200, (m * (len + 200)) + b]],
                stairs: []
            };

            for (let x = 0; x <= len; x += joistSpacing) geo.joists.push([[x, 0], [x, joistDepth]]);
            if (len % joistSpacing !== 0) geo.joists.push([[len, 0], [len, joistDepth]]);

            for (let x = 0; x <= len; x += spacing) {
                let intersectY = (m * x) + b;
                geo.posts.push([[x, -railHeight], [x, intersectY]]);
                geo.footings.push({ x: x, y: intersectY, depth: (x === 0) ? subFootOverride : footDepth, type: (x === 0) ? "FOOTG-SUB" : "FOOTG-STD" });
            }
            if (len % spacing !== 0) {
                let intersectY = (m * len) + b;
                geo.posts.push([[len, -railHeight], [len, intersectY]]);
                geo.footings.push({ x: len, y: intersectY, depth: footDepth, type: "FOOTG-STD" });
            }

            let currentX = len, currentY = 0, hitGround = false, stepCount = 0;
            const m_stair = riser / tread;
            
            geo.stairs.push([currentX, currentY]);
            if (m < m_stair) {
                while (!hitGround && stepCount < 100) {
                    stepCount++;
                    let nextX = currentX + tread;
                    let nextY = currentY + riser;
                    if (nextY < (m * nextX) + b) {
                        geo.stairs.push([nextX, currentY]);
                        geo.stairs.push([nextX, nextY]);
                        currentX = nextX;
                        currentY = nextY;
                    } else {
                        hitGround = true;
                        const intersectX = (b - (currentY - (m_stair * currentX))) / (m_stair - m);
                        const intersectY = (m * intersectX) + b;
                        geo.stairs.push([intersectX, currentY]);
                        geo.stairs.push([intersectX, intersectY]);
                        geo.stairs.push([len, intersectY]);
                        geo.stairs.push([len, 0]);
                    }
                }
            }

            return geo;
        }

        function drawPreview() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const geo = calculateGeometry();

            function drawLine(pts, color, width) {
                ctx.beginPath(); ctx.strokeStyle = color; ctx.lineWidth = width;
                let start = mapToCanvas(pts[0][0], pts[0][1]);
                ctx.moveTo(start.cx, start.cy);
                for(let i=1; i<pts.length; i++) {
                    let pt = mapToCanvas(pts[i][0], pts[i][1]);
                    ctx.lineTo(pt.cx, pt.cy);
                }
                ctx.stroke();
            }

            drawLine(geo.deck, "black", 2);
            geo.joists.forEach(j => drawLine(j, "#555", 1.5));
            drawLine(geo.grade, "brown", 1);
            geo.posts.forEach(p => drawLine(p, "blue", 1.5));
            drawLine(geo.rail, "orange", 1.5);
            drawLine(geo.railCapBot, "orange", 1.5);
            if(geo.stairs.length > 0) drawLine(geo.stairs, "green", 2);

            ctx.beginPath(); ctx.strokeStyle = "purple"; ctx.lineWidth = 1.5;
            geo.footings.forEach(f => {
                let padTopY = f.y + f.depth;
                let padBottomY = padTopY + 8; // 8-inch pad
                
                let postBot = mapToCanvas(f.x, padTopY);
                let postTop = mapToCanvas(f.x, f.y);
                ctx.moveTo(postTop.cx, postTop.cy); ctx.lineTo(postBot.cx, postBot.cy);

                let tl = mapToCanvas(f.x - 8, padTopY), tr = mapToCanvas(f.x + 8, padTopY);
                let br = mapToCanvas(f.x + 8, padBottomY), bl = mapToCanvas(f.x - 8, padBottomY);
                ctx.moveTo(tl.cx, tl.cy); ctx.lineTo(tr.cx, tr.cy);
                ctx.lineTo(br.cx, br.cy); ctx.lineTo(bl.cx, bl.cy); ctx.lineTo(tl.cx, tl.cy);
            });
            ctx.stroke();
        }

        function updateReadout() {
            const geo = calculateGeometry();
            let payload = [];

            payload.push({ entity: "polyline", layer: "WD-DECK-TOP", vertices: geo.deck.map(v => [v[0], -v[1]]) });
            payload.push({ entity: "polyline", layer: "WD-RAIL-TOP", vertices: geo.rail.map(v => [v[0], -v[1]]) });
            
            geo.joists.forEach(j => payload.push({ entity: "polyline", layer: "WD-JOIST", vertices: j.map(v => [v[0], -v[1]]) }));
            geo.posts.forEach(p => payload.push({ entity: "polyline", layer: "WD-POST", vertices: p.map(v => [v[0], -v[1]]) }));
            geo.footings.forEach(f => payload.push({ entity: "block", layer: "WD-FOOTING", name: f.type, insert: [f.x, -(f.y + f.depth)] }));
            
            if (geo.stairs.length > 0) {
                payload.push({ entity: "polyline", layer: "WD-STAIR", vertices: geo.stairs.map(v => [v[0], -v[1]]) });
            }

            let lispStr = "(\n";
            payload.forEach(item => {
                lispStr += `  (("entity" . "${item.entity}") ("layer" . "${item.layer}") `;
                if (item.vertices) {
                    const verts = item.vertices.map(v => `(${v[0].toFixed(4)} ${v[1].toFixed(4)})`).join(" ");
                    lispStr += `("vertices" ${verts}))\n`;
                } else if (item.insert) {
                    lispStr += `("name" . "${item.name}") ("insert" (${item.insert[0].toFixed(4)} ${item.insert[1].toFixed(4)})))\n`;
                }
            });
            lispStr += ")";
            
            readout.value = lispStr;
        }

        function downloadLisp() {
            const blob = new Blob([readout.value], { type: "text/plain" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "WallyCAD_Deck_Payload.txt";
            link.click();
        }

        window.onload = () => { zoomExtents(); updateReadout(); };
    </script>
</body>
</html>
