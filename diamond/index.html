<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WallyCAD - Element Assembly Matrix</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: monospace;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 { color: #4caf50; }
        .container {
            display: flex;
            gap: 20px;
            max-width: 1200px;
            width: 100%;
        }
        .controls {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            width: 300px;
            border: 1px solid #333;
        }
        .control-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; }
        input {
            width: 100%;
            padding: 8px;
            background-color: #2c2c2c;
            color: #fff;
            border: 1px solid #444;
            border-radius: 4px;
            font-family: monospace;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #4caf50;
            color: #121212;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover { background-color: #45a049; }
        svg {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
        }
        .output-area {
            width: 100%;
            margin-top: 20px;
        }
        textarea {
            width: 100%;
            height: 150px;
            background-color: #2c2c2c;
            color: #4caf50;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 10px;
            font-family: monospace;
            resize: vertical;
        }
    </style>
</head>
<body>

    <h2>WallyCAD Assembly Matrix</h2>

    <div class="container">
        <div class="controls">
            <div class="control-group">
                <label>Base Size (Outer Perimeter)</label>
                <input type="number" id="baseSize" value="100">
            </div>
            <div class="control-group">
                <label>Iterations (Assembly Parts)</label>
                <input type="number" id="iterations" value="4">
            </div>
            <div class="control-group">
                <label>Rotation Increment (Degrees)</label>
                <input type="number" id="rotDeg" value="90">
            </div>
            <div class="control-group">
                <label>Inner Square Rotation (Degrees)</label>
                <input type="number" id="innerRot" value="45">
            </div>
            <button onclick="generateAssembly()">Generate Assembly</button>
        </div>

        <svg id="canvas" width="500" height="500" viewBox="-250 -250 500 500">
            <g id="grid"></g>
            <g id="assemblyGroup"></g>
        </svg>
    </div>

    <div class="output-area">
        <label>WallyCAD Coordinate Output (.wally format / AutoLISP Tuples)</label>
        <textarea id="outputCoords" readonly></textarea>
    </div>

    <script>
        function drawGrid() {
            const grid = document.getElementById('grid');
            grid.innerHTML = `
                <line x1="-250" y1="0" x2="250" y2="0" stroke="#333" stroke-width="1"/>
                <line x1="0" y1="-250" x2="0" y2="250" stroke="#333" stroke-width="1"/>
            `;
        }

        function rotatePoint(x, y, angleDeg) {
            const rad = angleDeg * (Math.PI / 180);
            return {
                x: x * Math.cos(rad) - y * Math.sin(rad),
                y: x * Math.sin(rad) + y * Math.cos(rad)
            };
        }

        function generateAssembly() {
            const size = parseFloat(document.getElementById('baseSize').value);
            const iter = parseInt(document.getElementById('iterations').value);
            const rotInc = parseFloat(document.getElementById('rotDeg').value);
            const innerRot = parseFloat(document.getElementById('innerRot').value);
            
            const group = document.getElementById('assemblyGroup');
            group.innerHTML = ''; // Clear previous
            
            let outputText = ";; WallyCAD Trans-Rot Assembly Generated Coordinates\n";

            // Define Element A based on sketch (Quadrant A shaded region)
            // Outer corner at (-size, -size). Inner boundary created by 45-deg rotated inner square.
            const innerOffset = size * 0.5; // Scale of inner rotated square
            
            // Base polygon for Element A
            const elementA = [
                {x: -size, y: -size}, // Outer top-left
                {x: 0, y: -size},     // Outer top-mid
                {x: -innerOffset, y: -innerOffset}, // Inner rotated corner
                {x: -size, y: 0}      // Outer mid-left
            ];

            for (let i = 0; i < iter; i++) {
                const currentRot = i * rotInc;
                let pathD = "M ";
                let tupleStr = `(setq elem_${i} '(`;

                elementA.forEach((pt, index) => {
                    const rotPt = rotatePoint(pt.x, pt.y, currentRot);
                    
                    // Format for SVG
                    pathD += `${rotPt.x},${rotPt.y} `;
                    if (index < elementA.length - 1) pathD += "L ";
                    
                    // Format for WallyCAD output
                    tupleStr += `(${rotPt.x.toFixed(4)} ${rotPt.y.toFixed(4)}) `;
                });
                
                pathD += "Z";
                tupleStr += "))\n";
                outputText += tupleStr;

                // Create SVG Polygon
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute("d", pathD);
                path.setAttribute("fill", i === 0 ? "rgba(100, 100, 100, 0.5)" : "none"); // Shade first element like sketch
                path.setAttribute("stroke", "#4caf50");
                path.setAttribute("stroke-width", "2");
                group.appendChild(path);
            }
            
            // Draw the 45-degree inner square for visual reference
            let innerSquareD = "M ";
            const innerPts = [
                {x: 0, y: -innerOffset * 1.414}, 
                {x: innerOffset * 1.414, y: 0},
                {x: 0, y: innerOffset * 1.414},
                {x: -innerOffset * 1.414, y: 0}
            ];
            innerPts.forEach((pt, index) => {
                innerSquareD += `${pt.x},${pt.y} `;
                if(index < innerPts.length - 1) innerSquareD += "L ";
            });
            innerSquareD += "Z";
            
            const innerPath = document.createElementNS("http://www.w3.org/2000/svg", "path");
            innerPath.setAttribute("d", innerSquareD);
            innerPath.setAttribute("fill", "none");
            innerPath.setAttribute("stroke", "#ff9800");
            innerPath.setAttribute("stroke-width", "1");
            group.appendChild(innerPath);

            document.getElementById('outputCoords').value = outputText;
        }

        // Initialize
        drawGrid();
        generateAssembly();
    </script>
</body>
</html>
