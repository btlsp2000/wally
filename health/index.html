<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Health Manager</title>
  <style>
    /* ==========================================================================
       CSS VARIABLES & THEME TOKENS
       High-contrast, accessible palette supporting Light & Dark modes
       ========================================================================== */
    :root {
      --bg-app: #f1f5f9;
      --bg-surface: #ffffff;
      --bg-surface-alt: #f8fafc;
      --bg-header: #0f172a;
      --text-header: #f8fafc;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --border-color: #cbd5e1;
      --border-subtle: #e2e8f0;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --primary-soft: #e0f2fe;
      --primary-soft-text: #0369a1;
      --success: #059669;
      --success-soft: #d1fae5;
      --success-text: #065f46;
      --warning: #d97706;
      --warning-soft: #fef3c7;
      --warning-text: #92400e;
      --danger: #dc2626;
      --danger-soft: #fee2e2;
      --danger-text: #991b1b;
      --transit-bg: #1e293b;
      --transit-text: #38bdf8;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06);
      --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.08);
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    [data-theme="dark"] {
      --bg-app: #090d16;
      --bg-surface: #111827;
      --bg-surface-alt: #1e293b;
      --bg-header: #020617;
      --text-header: #f8fafc;
      --text-primary: #f1f5f9;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --border-subtle: #1e293b;
      --primary: #38bdf8;
      --primary-hover: #7dd3fc;
      --primary-soft: rgba(56, 189, 248, 0.15);
      --primary-soft-text: #7dd3fc;
      --success: #34d399;
      --success-soft: rgba(52, 211, 153, 0.15);
      --success-text: #6ee7b7;
      --warning: #fbbf24;
      --warning-soft: rgba(251, 191, 36, 0.15);
      --warning-text: #fde68a;
      --danger: #f87171;
      --danger-soft: rgba(248, 113, 113, 0.15);
      --danger-text: #fca5a5;
      --transit-bg: #0f172a;
      --transit-text: #38bdf8;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.4);
      --shadow-md: 0 6px 16px rgba(0, 0, 0, 0.5);
    }

    /* ==========================================================================
       RESET & BASE STYLES
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: var(--font-sans);
      background-color: var(--bg-app);
      color: var(--text-primary);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    a {
      color: var(--primary);
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }

    /* ==========================================================================
       TOP HEADER BAR
       ========================================================================== */
    .app-header {
      background-color: var(--bg-header);
      color: var(--text-header);
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .header-inner {
      max-width: 1320px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .brand {
      display: flex;
      flex-direction: column;
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin: 0;
    }

    .brand-meta {
      font-size: 0.78rem;
      color: #94a3b8;
      margin-top: 0.15rem;
    }

    .header-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
    }

    /* ==========================================================================
       BUTTONS & INTERACTIVE CONTROLS (Touch-Friendly >= 40px)
       ========================================================================== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      min-height: 40px;
      padding: 0.45rem 0.85rem;
      font-size: 0.875rem;
      font-weight: 600;
      font-family: inherit;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.05s ease;
      white-space: nowrap;
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn-primary {
      background-color: var(--primary);
      color: #ffffff;
    }
    [data-theme="dark"] .btn-primary {
      color: #020617;
    }
    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-secondary {
      background-color: var(--bg-surface);
      color: var(--text-primary);
      border-color: var(--border-color);
    }
    .btn-secondary:hover {
      background-color: var(--bg-surface-alt);
    }

    .btn-header {
      background-color: rgba(255, 255, 255, 0.1);
      color: #f8fafc;
      border-color: rgba(255, 255, 255, 0.2);
    }
    .btn-header:hover {
      background-color: rgba(255, 255, 255, 0.18);
    }

    .btn-danger {
      background-color: var(--danger-soft);
      color: var(--danger-text);
      border-color: transparent;
    }
    .btn-danger:hover {
      background-color: var(--danger);
      color: #ffffff;
    }

    .btn-sm {
      min-height: 32px;
      padding: 0.25rem 0.6rem;
      font-size: 0.8rem;
    }

    /* ==========================================================================
       TAB NAVIGATION
       ========================================================================== */
    .nav-bar {
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      padding: 0 1.25rem;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .nav-inner {
      max-width: 1320px;
      margin: 0 auto;
      display: flex;
      gap: 0.25rem;
    }

    .nav-tab {
      background: transparent;
      border: none;
      border-bottom: 3px solid transparent;
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 0.925rem;
      font-weight: 600;
      padding: 0.9rem 1.1rem;
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.15s ease, border-color 0.15s ease;
    }

    .nav-tab:hover {
      color: var(--text-primary);
    }

    .nav-tab.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    /* ==========================================================================
       MAIN LAYOUT & GRID SYSTEM
       ========================================================================== */
    .main-container {
      max-width: 1320px;
      margin: 0 auto;
      padding: 1.25rem;
    }

    .view-section {
      display: none;
    }
    .view-section.active {
      display: block;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1.25rem;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 1rem;
    }

    @media (max-width: 1024px) {
      .grid-4 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 768px) {
      .grid-2, .grid-4 {
        grid-template-columns: 1fr;
      }
      .main-container {
        padding: 0.85rem;
      }
    }

    /* ==========================================================================
       CARDS & TYPOGRAPHY
       ========================================================================== */
    .card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      padding: 1.15rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 0.65rem;
    }

    .card-title {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .section-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin: 1.5rem 0 0.85rem 0;
    }
    .section-header:first-child {
      margin-top: 0;
    }

    .section-title {
      margin: 0;
      font-size: 1.2rem;
      font-weight: 700;
    }

    /* ==========================================================================
       BADGES & STATUS PILLS
       ========================================================================== */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.2rem 0.55rem;
      font-size: 0.75rem;
      font-weight: 700;
      border-radius: 999px;
      letter-spacing: 0.01em;
    }

    .badge-info {
      background-color: var(--primary-soft);
      color: var(--primary-soft-text);
    }

    .badge-success {
      background-color: var(--success-soft);
      color: var(--success-text);
    }

    .badge-warning {
      background-color: var(--warning-soft);
      color: var(--warning-text);
    }

    .badge-danger {
      background-color: var(--danger-soft);
      color: var(--danger-text);
    }

    .transit-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background-color: var(--transit-bg);
      color: var(--transit-text);
      padding: 0.3rem 0.65rem;
      border-radius: var(--radius-sm);
      font-size: 0.82rem;
      font-weight: 700;
      border: 1px solid rgba(56, 189, 248, 0.35);
    }

    /* ==========================================================================
       FORMS & INPUTS
       ========================================================================== */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 0.85rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .form-group.full-width {
      grid-column: 1 / -1;
    }

    label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-secondary);
    }

    input[type="text"],
    input[type="number"],
    input[type="date"],
    input[type="time"],
    input[type="tel"],
    input[type="url"],
    select,
    textarea {
      width: 100%;
      min-height: 40px;
      padding: 0.45rem 0.65rem;
      font-family: inherit;
      font-size: 0.92rem;
      color: var(--text-primary);
      background-color: var(--bg-surface-alt);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
    }

    input:focus, select:focus, textarea:focus {
      outline: 2px solid var(--primary);
      outline-offset: -1px;
    }

    textarea {
      min-height: 70px;
      resize: vertical;
    }

    /* ==========================================================================
       CHECKLIST & LIST ITEMS
       ========================================================================== */
    .checklist-item {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.65rem 0.75rem;
      background-color: var(--bg-surface-alt);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
    }

    .checklist-left {
      display: flex;
      align-items: flex-start;
      gap: 0.65rem;
    }

    .checklist-left input[type="checkbox"] {
      width: 22px;
      height: 22px;
      margin-top: 2px;
      accent-color: var(--success);
      cursor: pointer;
    }

    .med-taken {
      text-decoration: line-through;
      opacity: 0.65;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 0.35rem 0;
      border-bottom: 1px dashed var(--border-subtle);
      font-size: 0.9rem;
    }
    .stat-row:last-child {
      border-bottom: none;
    }
    .stat-label {
      color: var(--text-secondary);
      font-weight: 500;
    }
    .stat-value {
      font-weight: 700;
      color: var(--text-primary);
    }

    /* ==========================================================================
       TABLES (Responsive Scroll Wrapper)
       ========================================================================== */
    .table-wrapper {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      background-color: var(--bg-surface);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.88rem;
    }

    th, td {
      padding: 0.7rem 0.85rem;
      border-bottom: 1px solid var(--border-subtle);
    }

    th {
      background-color: var(--bg-surface-alt);
      font-weight: 700;
      color: var(--text-secondary);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }

    th:hover {
      color: var(--text-primary);
    }

    tr:last-child td {
      border-bottom: none;
    }

    /* ==========================================================================
       RESOURCE CARDS & ACTION LINKS
       ========================================================================== */
    .resource-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.35rem;
    }

    .link-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.35rem 0.7rem;
      background-color: var(--primary-soft);
      color: var(--primary-soft-text);
      border-radius: var(--radius-sm);
      font-size: 0.84rem;
      font-weight: 600;
      text-decoration: none;
    }
    .link-pill:hover {
      filter: brightness(0.95);
      text-decoration: none;
    }

    /* ==========================================================================
       TAG CHIPS (ALLERGIES)
       ========================================================================== */
    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin-top: 0.35rem;
    }

    .tag-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.25rem 0.6rem;
      background-color: var(--danger-soft);
      color: var(--danger-text);
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
    }

    .tag-remove {
      background: none;
      border: none;
      color: inherit;
      font-weight: 700;
      cursor: pointer;
      padding: 0 0.2rem;
      font-size: 1rem;
      line-height: 1;
    }

    /* ==========================================================================
       MODALS & TOAST NOTIFICATION BANNER
       ========================================================================== */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background-color: rgba(2, 6, 23, 0.72);
      z-index: 100;
      padding: 1rem;
      align-items: center;
      justify-content: center;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      width: 100%;
      max-width: 720px;
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-body {
      padding: 1.25rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .modal-footer {
      padding: 0.85rem 1.25rem;
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: flex-end;
      gap: 0.6rem;
      background-color: var(--bg-surface-alt);
    }

    .json-viewer {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      background-color: var(--bg-app);
      color: var(--text-primary);
      padding: 1rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 52vh;
      overflow-y: auto;
      margin: 0;
    }

    .toast-banner {
      position: fixed;
      bottom: 1.25rem;
      right: 1.25rem;
      background-color: var(--bg-header);
      color: #ffffff;
      padding: 0.75rem 1.15rem;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-md);
      border-left: 4px solid var(--primary);
      font-size: 0.9rem;
      font-weight: 600;
      z-index: 200;
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .toast-banner.show {
      opacity: 1;
      transform: translateY(0);
    }

    .empty-state {
      color: var(--text-muted);
      font-size: 0.9rem;
      font-style: italic;
      padding: 0.5rem 0;
    }
  </style>
</head>
<body>

  <!-- ========================================================================
       TOP HEADER BAR
       ======================================================================== -->
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <h1 class="brand-title">
          <span>🩺</span> Personal Health Manager
        </h1>
        <div class="brand-meta" id="headerLastUpdated">Last updated: --</div>
      </div>

      <div class="header-actions">
        <button type="button" class="btn btn-header" id="btnThemeToggle" title="Toggle Light/Dark Mode">
          🌓 Theme
        </button>
        <button type="button" class="btn btn-header" id="btnExportJson">
          ⬇️ Export JSON
        </button>
        <label class="btn btn-header" style="cursor: pointer; margin: 0;">
          ⬆️ Import JSON
          <input type="file" id="inputImportJson" accept=".json,application/json" style="display: none;" />
        </label>
        <button type="button" class="btn btn-header" id="btnViewRawJson">
          { } Raw JSON
        </button>
        <button type="button" class="btn btn-danger" id="btnResetDefault">
          ↺ Reset Default
        </button>
      </div>
    </div>
  </header>

  <!-- ========================================================================
       MAIN TAB NAVIGATION
       ======================================================================== -->
  <nav class="nav-bar" aria-label="Primary Sections">
    <div class="nav-inner">
      <button type="button" class="nav-tab active" data-tab="overview">Overview &amp; Daily Log</button>
      <button type="button" class="nav-tab" data-tab="medications">Medications &amp; Refills</button>
      <button type="button" class="nav-tab" data-tab="resources">Resources &amp; Transit Directory</button>
      <button type="button" class="nav-tab" data-tab="history">Logs History &amp; Profile</button>
    </div>
  </nav>

  <!-- ========================================================================
       MAIN WORKSPACE CONTAINER
       ======================================================================== -->
  <main class="main-container">

    <!-- ======================================================================
         TAB 1: OVERVIEW & DAILY LOG
         ====================================================================== -->
    <section id="tab-overview" class="view-section active">
      <div class="grid-4" id="overviewSummaryCards">
        <!-- Populated dynamically via JS -->
      </div>

      <div class="grid-2" style="margin-top: 1.25rem;">
        <!-- Quick Vitals Entry Card -->
        <div class="card">
          <div class="card-header">
            <h2 class="card-title">Log Vitals</h2>
            <span class="badge badge-info">Quick Entry</span>
          </div>
          <form id="formQuickVitals">
            <div class="form-grid">
              <div class="form-group">
                <label for="vitalDate">Date</label>
                <input type="date" id="vitalDate" required />
              </div>
              <div class="form-group">
                <label for="vitalTime">Time</label>
                <input type="time" id="vitalTime" required />
              </div>
              <div class="form-group">
                <label for="vitalWeight">Weight (lbs)</label>
                <input type="number" step="0.1" id="vitalWeight" placeholder="e.g. 182.5" />
              </div>
              <div class="form-group">
                <label for="vitalSys">BP Syst
