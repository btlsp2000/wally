<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WallyCAD // EXPLODE — Multiline to Line Tuples</title>
  <style>
    :root {
      --bg: #121212;
      --panel: #1e1e1e;
      --border: #3a3a3a;
      --text: #eeeeee;
      --muted: #9a9a9a;
      --accent: #00ff00;
      --highlight: #61afef;
      --warn: #e5c07b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Consolas', 'Courier New', monospace;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: var(--panel);
      border-bottom: 2px solid var(--accent);
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    header h1 {
      margin: 0;
      font-size: 16px;
      letter-spacing: 1.5px;
      color: var(--accent);
    }
    header span.sub {
      color: var(--highlight);
      font-size: 11px;
      margin-left: 8px;
      text-transform: uppercase;
    }
    .toolbar {
      background: #171717;
      border-bottom: 1px solid var(--border);
      padding: 8px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px;
      font-size: 12px;
    }
    .toolbar label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    select, input[type="number"] {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 4px 6px;
      font-family: inherit;
      font-size: 12px;
    }
    button {
      background: rgba(0, 255, 0, 0.12);
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 5px 11px;
      font-family: inherit;
      font-size: 11px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background: var(--accent);
      color: #000;
    }
    button.alt {
      background: rgba(97, 175, 239, 0.12);
      color: var(--highlight);
      border-color: var(--highlight);
    }
    button.alt:hover {
      background: var(--highlight);
      color: #000;
    }
    .workspace {
      display: grid;
      grid-template-columns: 1fr 1fr 1.1fr;
      flex: 1;
      overflow: hidden;
    }
    .pane {
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      overflow: hidden;
    }
    .pane:last-child { border-right: none; }
    .pane-head {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 6px 12px;
      font-size: 11px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    textarea {
      flex: 1;
      width: 100%;
      background: var(--bg);
      color: var(--text);
      border: none;
      padding: 12px;
      font-family: inherit;
      font-size: 12px;
      line-height: 1.45;
      resize: none;
      outline: none;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: #0c0c0c;
    }
    .status {
      background: var(--panel);
      border-top: 1px solid var(--border);
      padding: 6px 16px;
      font-size: 11px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
    }
    @media (max-width: 900px) {
      .workspace { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr 1fr; }
      .pane { border-right: none; border-bottom: 1px solid var(--border); }
    }
  </style>
</head>
<body>

<header>
  <div>
    <h1>WALLY // EXPLODE</h1>
    <span class="sub">Multiline &amp; Polyline to Atomic Line Tuples</span>
  </div>
  <div style="display:flex; gap:8px; flex-wrap:wrap;">
    <button class="alt" onclick="loadSample('sdj')">SAMPLE: SDJ POLY</button>
    <button class="alt" onclick="loadSample('tuples')">SAMPLE: VERTEX CHAIN</button>
    <button onclick="copyOutput()">COPY TUPLES</button>
    <button onclick="exportWally()">EXPORT .WALLY</button>
    <button onclick="exportDXF()">EXPORT .DXF</button>
  </div>
</header>

<div class="toolbar">
  <label>
    Output Format:
    <select id="outFormat" onchange="process()">
      <option value="jsonTuples">2-Point Tuple Array [[[x1,y1],[x2,y2]], ...]</option>
      <option value="lineTuples">Tuple Per Row ([x1, y1], [x2, y2])</option>
      <option value="sdjLines">SDJ Segment Per Line (x1 y1 x2 y2)</option>
      <option value="wallyEntities">.WALLY LINE Entities JSON</option>
    </select>
  </label>
  <label>
    Decimals:
    <input type="number" id="decimals" value="4" min="0" max="8" style="width:52px" onchange="process()" />
  </label>
  <label>
    <input type="checkbox" id="closeLoop" onchange="process()" />
    Close Loop (Pn → P0)
  </label>
  <label>
    <input type="checkbox" id="dropZeroLen" checked onchange="process()" />
    Drop Zero-Length
  </label>
</div>

<div class="workspace">
  <div class="pane">
    <div class="pane-head">
      <span>INPUT: MULTILINE (SDJ / TUPLES / JSON)</span>
      <span id="inVertCount">0 vertices</span>
    </div>
    <textarea id="rawInput" placeholder="Paste SDJ string (0 0 10 0 10 5 0 5), vertex tuples [[0,0],[10,0],[10,5]], or .wally JSON..." oninput="process()"></textarea>
  </div>

  <div class="pane">
    <div class="pane-head">
      <span>OUTPUT: SINGLE LINE TUPLES</span>
      <span id="outSegCount">0 line tuples</span>
    </div>
    <textarea id="tupleOutput" readonly placeholder="Decomposed single-line tuples appear here..."></textarea>
  </div>

  <div class="pane">
    <div class="pane-head">
      <span>VIEWPORT: SEGMENT VERIFICATION</span>
      <span style="color:var(--warn)">MIDPOINT INDEXES</span>
    </div>
    <canvas id="previewCanvas"></canvas>
  </div>
</div>

<div class="status">
  <span id="statusMsg">READY — ACCEPTS FLAT SDJ, POINT ARRAYS, OR MULTI-VERTEX POLYLINES</span>
  <span>WallyCAD Primitive Reducer</span>
</div>

<script>
  const canvas = document.getElementById('previewCanvas');
  const ctx = canvas.getContext('2d');
  let currentLineTuples = []; // Array of [[x1, y1], [x2, y2]]

  /**
   * Core Reducer: Takes an ordered array of N vertices [P0, P1, ..., Pn-1]
   * and returns (N - 1) atomic two-point line tuples [[P0, P1], [P1, P2], ...].
   */
  function explodeVerticesToLineTuples(vertices, options = {}) {
    const { closeLoop = false, dropZeroLen = true, decimals = 4 } = options;
    const round = (n) => Number(Number(n).toFixed(decimals));
    const clean = vertices.map(pt => [round(pt[0]), round(pt[1])]);

    if (clean.length < 2) return [];

    const tuples = [];
    for (let i = 0; i < clean.length - 1; i++) {
      const a = clean[i];
      const b = clean[i + 1];
      if (dropZeroLen && Math.hypot(b[0] - a[0], b[1] - a[1]) < 1e-9) continue;
      tuples.push([a, b]);
    }

    if (closeLoop && clean.length > 2) {
      const first = clean[0];
      const last = clean[clean.length - 1];
      if (!dropZeroLen || Math.hypot(first[0] - last[0], first[1] - last[1]) >= 1e-9) {
        tuples.push([last, first]);
      }
    }

    return tuples;
  }

  /**
   * Universal Input Parser: Accepts SDJ flat numbers, JSON vertex lists, or .wally JSON
   */
  function parseInputVertices(text) {
    const trimmed = text.trim();
    if (!trimmed) return [];

    // 1. Try JSON parsing first
    if (trimmed.startsWith('[') || trimmed.startsWith('{')) {
      try {
        const parsed = JSON.parse(trimmed);
        // .wally object with entities
        if (parsed && Array.isArray(parsed.entities)) {
          const pts = [];
          parsed.entities.forEach((e, idx) => {
            if (e.p1 && e.p2) {
              if (idx === 0) pts.push(e.p1);
              pts.push(e.p2);
            }
          });
          return pts;
        }
        // Array of [x, y] points
        if (Array.isArray(parsed) && parsed.length > 0 && Array.isArray(parsed[0])) {
          // Check if already array of segments [[[x1,y1],[x2,y2]], ...]
          if (Array.isArray(parsed[0][0])) {
            const pts = [];
            parsed.forEach((seg, idx) => {
              if (idx === 0) pts.push(seg[0]);
              pts.push(seg[1]);
            });
            return pts;
          }
          return parsed.filter(p => p.length >= 2).map(p => [Number(p[0]), Number(p[1])]);
        }
        // Flat JSON number array [x0, y0, x1, y1, ...]
        if (Array.isArray(parsed) && typeof parsed[0] === 'number') {
          const pts = [];
          for (let i = 0; i + 1 < parsed.length; i += 2) {
            pts.push([Number(parsed[i]), Number(parsed[i + 1])]);
          }
          return pts;
        }
      } catch (e) {
        // Fall through to token parser
      }
    }

    // 2. Fallback: Space/Comma/Newline-delimited numeric stream (SDJ / CSV)
    const nums = trimmed
      .replace(/[\[\]\(\),;]+/g, ' ')
      .trim()
      .split(/\s+/)
      .map(Number)
      .filter(n => !isNaN(n));

    const vertices = [];
    for (let i = 0; i + 1 < nums.length; i += 2) {
      vertices.push([nums[i], nums[i + 1]]);
    }
    return vertices;
  }

  function process() {
    const raw = document.getElementById('rawInput').value;
    const format = document.getElementById('outFormat').value;
    const decimals = Math.max(0, Math.min(8, parseInt(document.getElementById('decimals').value, 10) || 0));
    const closeLoop = document.getElementById('closeLoop').checked;
    const dropZeroLen = document.getElementById('dropZeroLen').checked;

    const vertices = parseInputVertices(raw);
    document.getElementById('inVertCount').textContent = `${vertices.length} vertices`;

    currentLineTuples = explodeVerticesToLineTuples(vertices, { closeLoop, dropZeroLen, decimals });
    document.getElementById('outSegCount').textContent = `${currentLineTuples.length} line tuples`;

    let outText = '';
    if (currentLineTuples.length > 0) {
      if (format === 'jsonTuples') {
        outText = JSON.stringify(currentLineTuples, null, 2);
      } else if (format === 'lineTuples') {
        outText = currentLineTuples
          .map(t => `[[${t[0][0]}, ${t[0][1]}], [${t[1][0]}, ${t[1][1]}]]`)
          .join('\n');
      } else if (format === 'sdjLines') {
        outText = currentLineTuples
          .map(t => `${t[0][0]} ${t[0][1]} ${t[1][0]} ${t[1][1]}`)
          .join('\n');
      } else if (format === 'wallyEntities') {
        const entities = currentLineTuples.map(t => ({
          type: 'LINE',
          layer: 'EXPLODED',
          p1: t[0],
          p2: t[1]
        }));
        outText = JSON.stringify(entities, null, 2);
      }
    }

    document.getElementById('tupleOutput').value = outText;
    renderPreview();
  }

  function renderPreview() {
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    ctx.fillStyle = '#0c0c0c';
    ctx.fillRect(0, 0, rect.width, rect.height);

    if (currentLineTuples.length === 0) return;

    // Compute bounding box
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    currentLineTuples.forEach(([p1, p2]) => {
      minX = Math.min(minX, p1[0], p2[0]);
      minY = Math.min(minY, p1[1], p2[1]);
      maxX = Math.max(maxX, p1[0], p2[0]);
      maxY = Math.max(maxY, p1[1], p2[1]);
    });

    const spanX = Math.max(maxX - minX, 1);
    const spanY = Math.max(maxY - minY, 1);
    const pad = 36;
    const scale = Math.min((rect.width - pad * 2) / spanX, (rect.height - pad * 2) / spanY);

    const cx = (minX + maxX) / 2;
    const cy = (minY + maxY) / 2;
    const tx = (x) => rect.width / 2 + (x - cx) * scale;
    const ty = (y) => rect.height / 2 - (y - cy) * scale;

    // Draw each decomposed single line segment with index label
    currentLineTuples.forEach(([p1, p2], idx) => {
      const x1 = tx(p1[0]), y1 = ty(p1[1]);
      const x2 = tx(p2[0]), y2 = ty(p2[1]);

      ctx.strokeStyle = idx % 2 === 0 ? '#00ff00' : '#61afef';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();

      // Endpoint nodes
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(x1, y1, 2.8, 0, Math.PI * 2);
      ctx.arc(x2, y2, 2.8, 0, Math.PI * 2);
      ctx.fill();

      // Segment index badge at midpoint
      const mx = (x1 + x2) / 2;
      const my = (y1 + y2) / 2;
      ctx.fillStyle = '#e5c07b';
      ctx.font = '11px monospace';
      ctx.fillText(`L${idx + 1}`, mx + 4, my - 4);
    });
  }

  function loadSample(type) {
    if (type === 'sdj') {
      document.getElementById('rawInput').value = "0 0 52 0 52 36 0 36";
      document.getElementById('closeLoop').checked = true;
    } else {
      document.getElementById('rawInput').value = JSON.stringify([
        [0, 0], [12, 0], [18, 8], [30, 8], [36, 0], [48, 0]
      ], null, 2);
      document.getElementById('closeLoop').checked = false;
    }
    process();
    setStatus(`LOADED ${type.toUpperCase()} SAMPLE`);
  }

  function copyOutput() {
    const out = document.getElementById('tupleOutput').value;
    if (!out) return;
    navigator.clipboard.writeText(out).then(() => setStatus("COPIED LINE TUPLES TO CLIPBOARD"));
  }

  function exportWally() {
    if (!currentLineTuples.length) return;
    const payload = {
      generator: "WallyCAD_Explode_V1",
      entities: currentLineTuples.map(t => ({
        type: "LINE",
        layer: "EXPLODED",
        p1: t[0],
        p2: t[1]
      }))
    };
    downloadFile(JSON.stringify(payload, null, 2), "wally_exploded_lines.wally", "application/json");
  }

  function exportDXF() {
    if (!currentLineTuples.length) return;
    let dxf = "0\nSECTION\n2\nHEADER\n0\nENDSEC\n0\nSECTION\n2\nENTITIES\n";
    currentLineTuples.forEach(([p1, p2]) => {
      dxf += `0\nLINE\n8\nEXPLODED\n10\n${p1[0]}\n20\n${p1[1]}\n30\n0.0\n11\n${p2[0]}\n21\n${p2[1]}\n31\n0.0\n`;
    });
    dxf += "0\nENDSEC\n0\nEOF\n";
    downloadFile(dxf, "wally_exploded_lines.dxf", "application/dxf");
  }

  function downloadFile(content, filename, mime) {
    const blob = new Blob([content], { type: mime });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    setStatus(`EXPORTED ${filename}`);
  }

  function setStatus(msg) {
    document.getElementById('statusMsg').textContent = msg;
  }

  window.addEventListener('resize', renderPreview);
  loadSample('sdj');
</script>
</body>
</html>
