<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WallyCAD | Routing...</title>
    
    <!-- 1. PRIMARY ROUTER: Meta Refresh (0 seconds) -->
    <meta http-equiv="refresh" content="0; url=/v17/">
    
    <style>
        /* Dark mode styling prevents a white flash during the split-second redirect */
        body {
            background-color: #1e1e1e;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .terminal {
            border: 1px solid #444;
            background-color: #121212;
            padding: 30px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        a {
            color: #00ff00;
            text-decoration: none;
            border-bottom: 1px dashed #00ff00;
            margin-top: 15px;
            display: inline-block;
        }
        a:hover {
            background-color: #00ff00;
            color: #000;
        }
    </style>
</head>
<body>

    <div class="terminal">
        <div>SYS.ROUTING // TARGET: V17</div>
        <a href="/v17/" id="manual-link">MANUAL OVERRIDE</a>
    </div>

    <!-- 2. SECONDARY ROUTER: JavaScript Fallback -->
    <script>
        // To bump future versions, simply change this string to "/v18/", "/v19/", etc.
        const targetDirectory = "/new/";
        
        // Use replace() so the redirect doesn't clutter the browser's back button history
        window.location.replace(targetDirectory);
    </script>

</body>
</html>
