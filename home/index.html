<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WALLYCAD | DASHBOARD / CP</title>
    <style>
        :root {
            --cad-bg: #121212;
            --panel-bg: #1a1a1a;
            --header-bg: #222222;
            --accent: #00ff00;
            --accent-dim: rgba(0, 255, 0, 0.2);
            --text-main: #eeeeee;
            --text-muted: #888888;
            --border-color: #333333;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--cad-bg);
            color: var(--text-main);
            font-family: 'Consolas', 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* Top Header */
        #header {
            height: 50px;
            background-color: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 20px;
            box-sizing: border-box;
            flex-shrink: 0;
            z-index: 10;
        }

        #header h1 {
            margin: 0;
            font-size: 18px;
            font-weight: bold;
            color: var(--accent);
            letter-spacing: 2px;
        }

        #header .version {
            margin-left: auto;
            font-size: 12px;
            color: var(--text-muted);
        }

        /* Main Workspace: Sidebar + Iframe */
        #main-container {
            display: flex;
            flex-grow: 1;
            height: calc(100vh - 50px);
        }

        /* Left Navigation (Menu @) */
        #sidebar {
            width: 260px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 15px 10px;
            box-sizing: border-box;
            flex-shrink: 0;
            overflow-y: auto;
        }

        .nav-section {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 10px;
            padding-left: 5px;
            letter-spacing: 1px;
        }

        .nav-btn {
            background: transparent;
            color: var(--text-main);
            border: 1px solid transparent;
            padding: 12px 10px;
            margin-bottom: 5px;
            font-family: inherit;
            font-size: 13px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            border-left: 3px solid transparent;
        }

        .nav-btn:hover {
            background-color: var(--border-color);
            border-left: 3px solid var(--text-muted);
        }

        .nav-btn.active {
            background-color: var(--accent-dim);
            color: var(--accent);
            border: 1px solid var(--border-color);
            border-left: 3px solid var(--accent);
            font-weight: bold;
        }

        .divider {
            height: 1px;
            background-color: var(--border-color);
            margin: 15px 0;
        }

        /* Router Content (Iframe) */
        #router-view {
            flex-grow: 1;
            position: relative;
            background-color: var(--cad-bg);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .footer-note {
            margin-top: auto;
            text-align: center;
            font-size: 10px;
            color: var(--text-muted);
            padding-top: 20px;
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header id="header">
        <h1>WALLYCAD | DASHBOARD / CP</h1>
        <div class="version">SYS.ROUTER // V17.ENV</div>
    </header>

    <!-- MAIN WORKSPACE -->
    <div id="main-container">
        
        <!-- SIDEBAR NAVIGATION -->
        <nav id="sidebar">
            <div class="nav-section">Primary System</div>
            <button class="nav-btn active" onclick="loadModule('https://wallycad.com/v17', this)">Core Engine (v1.0.17)</button>
            
            <div class="divider"></div>
            
            <div class="nav-section">Standalone Modules</div>
            <button class="nav-btn" onclick="loadModule('https://wallycad.com/ellipse', this)">Ellipse Generator</button>
            <button class="nav-btn" onclick="loadModule('https://wallycad.com/jsontowally', this)">Data Converter</button>
            <button class="nav-btn" onclick="loadModule('https://wallycad.com/deck', this)">Wally-Deck</button>
            <button class="nav-btn" onclick="loadModule('https://wallycad.com/traverse', this)">Perimeter Traverse</button>

            <div class="footer-note">
                WALLYCAD ENTERPRISE<br>
                &copy; 2026
            </div>
        </nav>

        <!-- IFRAME ROUTER -->
        <main id="router-view">
            <!-- Defaults to the Core Engine index.html -->
            <iframe id="module-frame" src="https://wallycad.com/new" title="WallyCAD Module Router"></iframe>
        </main>

    </div>

    <script>
        function loadModule(url, btnElement) {
            // Update iframe source
            const frame = document.getElementById('module-frame');
            frame.src = url;

            // Remove active class from all buttons
            const buttons = document.querySelectorAll('.nav-btn');
            buttons.forEach(btn => btn.classList.remove('active'));

            // Add active class to the clicked button
            btnElement.classList.add('active');
        }
    </script>

</body>
</html>
