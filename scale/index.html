<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WallyCAD - Data Processor (with Scale)</title>
    <style>
        :root { --accent: #0f0; --bg: #121212; --panel: #1e1e1e; }
        body { margin: 0; background: var(--bg); color: #ececec; font-family: 'Courier New', monospace; }
        
        /* Layout */
        .wally-interface { display: flex; flex-direction: column; height: 100vh; }
        .data-bay { display: flex; flex: 1; gap: 10px; padding: 15px; background: #000; }
        
        /* Textareas & Inputs */
        textarea { 
            flex: 1; background: var(--panel); color: var(--accent); 
            border: 1px solid #333; padding: 15px; font-size: 14px; 
            resize: none; outline: none; border-radius: 4px;
        }
        textarea:focus { border-color: var(--accent); }
        
        input[type="number"] {
            background: #000; color: var(--accent); border: 1px solid #333;
            padding: 10px; width: 80px; font-family: 'Courier New', monospace;
            font-size: 14px; outline: none; border-radius: 4px; text-align: center;
        }
        input[type="number"]:focus { border-color: var(--accent); }

        /* Labels & Status */
        .label { font-size: 12px; color: #888; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
        .panel-container { display: flex; flex-direction: column; flex: 1; }
        
        /* Footer Controls */
        .controls { padding: 15px; background: var(--panel); display: flex; align-items: center; gap: 20px; border-top: 1px solid #333; }
        .scale-wrapper { display: flex; align-items: center; gap: 10px; }
        
        button { 
            background: var(--accent); color: #000; border: none; padding: 10px 20px; 
            font-weight: bold; cursor: pointer; text-transform: uppercase; border-radius: 4px;
        }
        button:hover { background: #0c0; }
        #status { color: #888; font-size: 14px; }
    </style>
</head>
<body>

<div class="wally-interface">
    <div class="data-bay">
        <div class="panel-container">
            <div class="label">Raw Input (Space Delimited)</div>
            <textarea id="rawInput" placeholder="Astoria -123.83 46.19&#10;PDX -122.67 45.51..."></textarea>
        </div>
        
        <div class="panel-container">
            <div class="label">WallyCAD Output (Parsed for Engine)</div>
            <textarea id="parsedOutput" readonly placeholder="Waiting for processing..."></textarea>
        </div>
    </div>

    <div class="controls">
        <button onclick="processData()">Parse & Plot</button>
        
        <div class="scale-wrapper">
            <div class="label" style="margin: 0;">SCALE MULTIPLIER:</div>
            <input type="number" id="scaleFactor" value="1.0" step="0.1">
        </div>

        <div id="status">Ready for input...</div>
    </div>
</div>

<script>
    function processData() {
        const input = document.getElementById('rawInput').value.trim();
        const outputField = document.getElementById('parsedOutput');
        const status = document.getElementById('status');
        
        // Grab the scale multiplier, default to 1.0 if invalid or empty
        const scale = parseFloat(document.getElementById('scaleFactor').value) || 1.0;
        
        if (!input) {
            status.innerText = "Error: No data detected.";
            status.style.color = "#ff4444";
            return;
        }

        const lines = input.split('\n');
        let processed = [];

        lines.forEach(line => {
            // Clean up whitespace and format
            const parts = line.split(/\s+/);
            if (parts.length >= 3) {
                const [name, x, y] = parts;
                
                // Apply the scaling factor before locking the float precision
                const scaledX = (parseFloat(x) * scale).toFixed(4);
                const scaledY = (parseFloat(y) * scale).toFixed(4);
                
                // Add a structured prefix for the WallyCAD geometry engine
                processed.push(`POINT "${name}" X:${scaledX} Y:${scaledY}`);
            }
        });

        outputField.value = processed.join('\n');
        status.innerText = `Success: Processed ${processed.length} points at ${scale}x scale.`;
        status.style.color = "#888";
        
        // At this point, you would trigger your canvas render function:
        // wally.render(processed);
    }
</script>

</body>
</html>
